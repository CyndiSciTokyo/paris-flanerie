<title>巴黎文艺漫步</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one narrow column, like walking a single street. A métro-style route line on top,
   then a Paris enamel street plaque naming the stop, then the conversation. */
:root{
  --bg:#eceff3; --surface:#f9fafc; --ink:#1a2233; --muted:#586275; --line:#cfd5de;
  --enamel:#1b3f94; --enamel-ink:#ffffff; --frame:#2f6b4f; --accent:#1b3f94;
  --ok:#2a6549; --ok-bg:#dfeee6; --bad:#a9342c; --bad-bg:#f6e1df;
  --water:#a9c2dd; --park:#cfe0cf; --gold:#a8770a;
  --f-plaque:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-fr:'Spectral',Georgia,'Times New Roman',serif;
  --f-ui:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141d; --surface:#18202d; --ink:#e7eaf0; --muted:#9aa5b8; --line:#2d3748;
  --enamel:#2449a6; --enamel-ink:#ffffff; --frame:#3f8c68; --accent:#93adf2;
  --ok:#6cc097; --ok-bg:#17302a; --bad:#ec857c; --bad-bg:#3a1f1f;
  --water:#2c476b; --park:#243d31; --gold:#e6b94a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#18202d; --ink:#e7eaf0; --muted:#9aa5b8; --line:#2d3748;
  --enamel:#2449a6; --enamel-ink:#ffffff; --frame:#3f8c68; --accent:#93adf2;
  --ok:#6cc097; --ok-bg:#17302a; --bad:#ec857c; --bad-bg:#3a1f1f;
  --water:#2c476b; --park:#243d31; --gold:#e6b94a; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-ui)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{margin:0;font-size:1.25rem;font-weight:600}
h1 span{font:italic 400 1rem var(--f-fr);color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}

/* street plaque */
.plaque-wrap{display:inline-flex;flex-direction:column;align-items:center;align-self:flex-start;max-width:100%}
.arr{background:var(--enamel);color:var(--enamel-ink);border:3px solid var(--frame);border-bottom:0;
  border-radius:40px 40px 0 0;padding:3px 18px 1px;font:600 .85rem var(--f-plaque);letter-spacing:.1em}
.plaque{background:var(--enamel);color:var(--enamel-ink);border:3px solid var(--frame);border-radius:4px;
  padding:8px 22px 10px;font:600 clamp(1.5rem,6.5vw,2.3rem)/1.08 var(--f-plaque);text-transform:uppercase;
  letter-spacing:.05em;text-align:center;text-wrap:balance}
.place{font-size:.9rem;color:var(--muted)}
.place b{color:var(--ink);font-weight:600}
.scene{max-width:62ch}

.view{display:flex;flex-direction:column;gap:20px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font-size:.95rem}
#map svg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
#map .road{stroke:var(--line);fill:none;stroke-width:2}
#map .water{stroke:var(--water);fill:none;stroke-width:18;stroke-linecap:round}
#map .isle{fill:var(--surface)}
#map .park{fill:var(--park)}
#map .maptxt{fill:var(--muted);font:600 12px var(--f-plaque);letter-spacing:.22em}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--enamel);stroke:var(--surface);stroke-width:3}
.pin.done .dot{fill:var(--frame)}
.pin.gold .dot{stroke:var(--gold)}
.pin:hover .dot,.pin:focus-visible .dot{stroke:var(--accent);stroke-width:5}
.pin .num{fill:var(--enamel-ink);font:600 17px var(--f-plaque);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .lab{fill:var(--ink);font:500 15px var(--f-fr);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
@media (max-width:520px){.pin .lab{display:none}}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chapters button{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.chapters button:hover .cname b{color:var(--accent)}
.cnum{width:30px;height:30px;border-radius:50%;background:var(--enamel);color:var(--enamel-ink);display:flex;align-items:center;justify-content:center;font:600 .95rem var(--f-plaque)}
.cnum.done{background:var(--frame)}
.cname{display:flex;flex-direction:column;min-width:0}
.cname span{color:var(--muted);font-size:.9rem}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.bigstars{font-size:2rem;line-height:1}
.combo{color:var(--gold)}
.souv{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:560px){.souv{grid-template-columns:repeat(4,1fr)}}
.scard{display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;min-width:0}
.scard svg{display:block;width:100%;height:auto}
.scard .qbg{fill:#b9c6d6}
.scard .qlab{min-height:2em;display:flex;align-items:center;justify-content:center;font-size:.9rem;padding:2px;text-align:center}
.scard.gold{border-color:var(--gold)}
.scard.lock{align-items:center;justify-content:center;aspect-ratio:1;color:var(--muted);font:600 1.4rem var(--f-plaque);border-style:dashed}
.keep{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.typecard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.typecard .tfr{font:500 clamp(1.5rem,6vw,2.1rem)/1.15 var(--f-fr);text-wrap:balance}
.typecard .tzh{font-weight:600}
.attrs{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:10px 12px;align-items:center}
.attrs .an{display:flex;flex-direction:column;line-height:1.3}
.attrs .an span{color:var(--muted);font-size:.8rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.attrs .av{text-align:right;font-variant-numeric:tabular-nums}
.picbox{display:flex;flex-direction:column;gap:6px}
#room svg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.ritem:hover,.ritem:focus-visible{filter:brightness(1.1)}
#pic svg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.hot{cursor:pointer;outline:none}
.hot .mk{fill:#ffffff;stroke:#1b3f94;stroke-width:2.5}
.hot .mkdot{fill:#1b3f94}
.hot.found .mk{stroke:#2f6b4f}
.hot.found .mkdot{fill:#2f6b4f}
.hot:hover .mk,.hot:focus-visible .mk,.hot.sel .mk{stroke-width:5}
#word:empty{display:none}
.quiz{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:560px){.quiz{grid-template-columns:repeat(3,1fr)}}
.qcard{display:flex;flex-direction:column;padding:0;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;min-width:0}
.qcard svg{display:block;width:100%;height:auto}
.qcard .qbg{fill:#b9c6d6}
.qcard .qlab{min-height:2.2em;display:flex;align-items:center;justify-content:center;font-size:1rem;padding:2px 4px;text-align:center}
.qcard:hover:not(:disabled){border-color:var(--accent)}
.qcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.qcard.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.qcard.bad{border-color:var(--bad);background:var(--bad-bg)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fr{font-family:var(--f-fr);font-size:1.2rem;line-height:1.45}
.zh{color:var(--muted);font-size:.9rem}
.count{font:600 .8rem var(--f-plaque);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#step{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.bubble .who{font:600 .8rem var(--f-plaque);letter-spacing:.1em;text-transform:uppercase;color:var(--frame)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.line > .fr{min-width:0}
.ctx{font-weight:600}

.spk{display:inline-flex;gap:4px;flex:none}
.spk button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);
  border-radius:999px;padding:4px 9px;font-size:.8rem;color:var(--accent);line-height:1}
.spk button:hover{border-color:var(--accent)}
.spk.big .spk-b{background:var(--enamel);border-color:var(--enamel);color:var(--enamel-ink);padding:9px 16px;font-size:.95rem}
.spk.big .spk-s{padding:9px 12px}
.reveal{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.9rem;align-self:flex-start}

.opts{display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.opt{flex:1;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.75}
.opt:disabled{cursor:default}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .opt{flex:none}

.slot,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;align-items:center}
.slot{border-bottom:2px solid var(--line);padding-bottom:8px}
.slot:empty::before{content:"点下面的词，拼出这句话";color:var(--muted);font-size:.9rem}
.tile{background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:6px 12px}
.tile[disabled]{visibility:hidden}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.primary{background:var(--enamel);color:var(--enamel-ink);border:0;border-radius:8px;padding:10px 20px;font-weight:600}
.primary:disabled{opacity:.45;cursor:default}

.entries.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media (max-width:560px){.entries.vocab{grid-template-columns:minmax(0,1fr)}}
.recall{border-top:1px solid var(--line);padding-top:12px}
.recall summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.recall[open] summary{margin-bottom:14px}
.recall .lesson{display:flex;flex-direction:column;gap:14px}
.lesson{display:flex;flex-direction:column;gap:14px}
.fb{display:flex;flex-direction:column;gap:8px}
.fb:empty{display:none}
.fb .ok{color:var(--ok);font:500 1.15rem var(--f-fr)}
.fb .no{color:var(--bad);font-size:.95rem}
.note{border-left:3px solid var(--frame);padding-left:12px;font-size:.95rem;max-width:60ch}

h2{margin:0;font-size:1.1rem}
h3{margin:0;font:600 1rem var(--f-plaque);letter-spacing:.08em;text-transform:uppercase;color:var(--frame)}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.entries li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stop{display:flex;flex-direction:column;gap:8px}
.locked{color:var(--muted);font-size:.9rem}
.warn{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;font-size:.9rem}
.voice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.voice select{font:inherit;max-width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
</style>

<div class="wrap">
  <header>
    <h1>巴黎文艺漫步<span>Flânerie à Paris</span></h1>
    <div class="tabs" role="tablist">
      <button id="tab-chambre" role="tab" type="button">房间</button>
      <button id="tab-carte" role="tab" type="button">地图</button>
      <button id="tab-carnet" role="tab" type="button">手帐</button>
      <button id="tab-profil" role="tab" type="button">我的巴黎</button>
    </div>
  </header>
  <p id="warn" class="warn" hidden>录音文件没有加载出来，这台设备上也没有检测到法语语音，发音按钮可能没有声音。Mac 上可以在"系统设置 → 辅助功能 → 朗读内容 → 系统语音 → 管理语音"里添加法语（推荐 Amélie 或 Thomas），然后刷新本页。</p>

  <main id="chambre" class="view" hidden></main>

  <main id="carte" class="view" hidden>
    <div id="map"></div>
    <p class="zh" id="mapsum"></p>
    <ol class="chapters" id="chapters"></ol>
  </main>

  <main id="jeu" class="view" hidden>
    <button class="back" id="back" type="button">← 回到地图</button>
    <div class="plaque-wrap"><div class="arr" id="arr"></div><div class="plaque" id="plaque"></div></div>
    <p class="place" id="place"></p>
    <div class="picbox">
      <div id="pic"></div>
      <p class="zh" id="pichint"></p>
      <div id="word" aria-live="polite"></div>
    </div>
    <p class="scene" id="scene"></p>
    <section id="step"></section>
  </main>

  <main id="carnet" class="view" hidden></main>

  <main id="profil" class="view" hidden></main>

  <div class="voice" id="voicebox" hidden>
    <label for="voice">录音没加载出来，改用设备语音</label>
    <select id="voice"></select>
    <span class="spk"><button type="button" id="voicetest">试听</button></span>
  </div>
</div>

<script>
const DATA=[
{plaque:"Quai de Conti",arr:"6e Arr.",place:"塞纳河畔的旧书摊",frPlace:"Les bouquinistes",who:"Le bouquiniste",
 scene:"周六上午十点，你沿着塞纳河左岸走。河堤上一排墨绿色的铁皮箱子打开着，这是巴黎的旧书摊，已经摆了四百多年。一位戴贝雷帽的老先生抬头看见了你。任务：买到一本波德莱尔的《恶之花》。",
 steps:[
  {t:"listen",fr:"Bonjour ! Vous cherchez quelque chose ?",q:"老先生在问什么？",opts:["您在找什么东西吗？","您想喝点什么吗？","您是从哪里来的？"],
   note:"chercher 是“找”。vous 是“您”，对陌生人都用它；熟人之间才用 tu。"},
  {t:"build",ctx:"告诉他：您好，我在找一本波德莱尔的书。",tokens:["Bonjour,","je","cherche","un","livre","de","Baudelaire."],extra:["une"],
   zh:"您好，我在找一本波德莱尔的书。",note:"Je cherche… 是“我在找……”。livre（书）是阳性词，所以“一本”用 un。"},
  {t:"fill",npc:["Ah, Les Fleurs du mal ! Voilà.","啊，《恶之花》！给您。"],ctx:"他把书递给你，又补了一句。选出正确的词：",before:"C'est ",after:" belle édition.",opts:["une","un","des"],
   full:"C'est une belle édition.",zh:"这是一个很漂亮的版本。",note:"édition 是阴性词，用 une。小窍门：以 -tion 结尾的词几乎都是阴性。"},
  {t:"choose",ctx:"你想问价钱，该怎么说？",opts:[["C'est combien, s'il vous plaît ?","请问多少钱？"],["C'est où, s'il vous plaît ?","请问在哪里？"],["C'est qui ?","这是谁？"]],
   note:"combien 是“多少”，où 是“哪里”，qui 是“谁”。s'il vous plaît 加在句尾就很客气。"},
  {t:"listen",fr:"Douze euros.",q:"这本书多少钱？",opts:["12 欧元","2 欧元","20 欧元"],
   note:"三个容易混的数字：deux（2）、douze（12）、vingt（20）。点慢速多听几遍 douze。"}
 ],
 vocab:[["Bonjour", "您好"], ["s'il vous plaît", "请，劳驾"], ["chercher", "找"], ["je cherche…", "我在找……"], ["vous cherchez…", "您在找……"], ["quelque chose", "某样东西"], ["un livre", "一本书"], ["une édition", "一个版本"], ["beau, belle", "漂亮的（阳性，阴性）"], ["C'est…", "这是……"], ["combien", "多少"], ["où", "哪里"], ["qui", "谁"], ["un euro", "一欧元"], ["deux, douze, vingt", "2，12，20"]],
 lesson:{title:"un 和 une",text:["法语的每个名词都有“性别”：阳性或阴性。说“一个”的时候，阳性名词前用 un，阴性名词前用 une。", "性别大多没有道理可讲，所以背单词时要连着 un 或 une 一起背。一个小窍门：以 -tion 结尾的词几乎都是阴性。", "另外，对陌生人说“您”用 vous，动词跟着变：je cherche（我找），vous cherchez（您找）。"],ex:[["un livre", "一本书（阳性）"], ["une édition", "一个版本（阴性）"], ["une boîte", "一个箱子（阴性）"], ["C'est un livre.", "这是一本书。"], ["C'est une belle édition.", "这是一个漂亮的版本。"]]},
 carnet:[["Je cherche un livre de Baudelaire.","我在找一本波德莱尔的书。"],["C'est combien, s'il vous plaît ?","请问多少钱？"],["C'est une belle édition.","这是一个很漂亮的版本。"],["Douze euros.","十二欧元。"]],
 gram:"名词分阳性和阴性，“一个”跟着变：阳性 un livre，阴性 une édition。"},

{plaque:"Boulevard Saint-Germain",arr:"6e Arr.",place:"花神咖啡馆",frPlace:"Café de Flore",who:"Le serveur",
 scene:"拿着诗集，你走进花神咖啡馆。萨特和波伏瓦当年就在这里的桌子上写作，一坐一整天。穿白围裙的服务生走了过来。任务：点一杯咖啡，聊两句，然后结账。",
 steps:[
  {t:"listen",fr:"Bonjour ! Qu'est-ce que vous désirez ?",q:"服务生在问什么？",opts:["您想要点什么？","您叫什么名字？","你们一共几位？"],
   note:"Qu'est-ce que… 是最常用的“什么”问句开头。désirer 是“想要”，店员常用。"},
  {t:"build",ctx:"点单：我想要一杯奶油咖啡，谢谢。",tokens:["Je","voudrais","un","café","crème,","s'il vous plaît."],extra:["une"],
   zh:"我想要一杯奶油咖啡，劳驾。",note:"Je voudrais… 是客气的“我想要”，点东西、买东西都用它，比 je veux（我要）礼貌得多。"},
  {t:"fill",npc:["Vous êtes touriste ?","您是游客吗？"],ctx:"你回答：不，我是为了文学来的。",before:"Non, je ",after:" ici pour la littérature.",opts:["suis","es","est"],
   full:"Non, je suis ici pour la littérature.",zh:"不，我是为了文学来这里的。",note:"“是／在”这个动词跟着人称变：je suis（我）、tu es（你）、il / elle est（他／她）、vous êtes（您）。"},
  {t:"choose",ctx:"咖啡喝完了，你想结账。",opts:[["L'addition, s'il vous plaît.","请结账。"],["La carte, s'il vous plaît.","请给我菜单。"],["Le livre, s'il vous plaît.","请给我那本书。"]],
   note:"l'addition 是账单，la carte 是菜单。在法国要自己开口要账单，服务生不会主动拿来。"},
  {t:"listen",fr:"Merci, bonne journée !",q:"服务生最后说了什么？",opts:["谢谢，祝您今天愉快！","谢谢，晚上好！","谢谢，明天见！"],

/* ---------- speech: recorded audio first, the device's own voice as a fallback ---------- */
const akey=t=>{let x=2166136261;for(let i=0;i<t.length;i++){x^=t.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return ('0000000'+x.toString(16)).slice(-8)};
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[],voice=null,player=null,fellBack=false;
function fallbackUI(){
  $('#voicebox').hidden=!(fellBack&&voices.length>1);
  $('#warn').hidden=!(fellBack&&!voices.length);
}
function loadVoices(){
  if(!synth)return;
  voices=(synth.getVoices()||[]).filter(v=>/^fr/i.test(v.lang));
  const score=v=>(/fr[-_]FR/i.test(v.lang)?2:0)+(/google|am[ée]lie|thomas|audrey|premium|enhanced|natural/i.test(v.name)?1:0);
  voices.sort((a,b)=>score(b)-score(a));
  voice=voices.find(v=>v.name===st.voice)||voices[0]||null;
  $('#voice').replaceChildren(...voices.map(v=>h('option',{value:v.name,selected:v===voice},v.name+'（'+v.lang+'）')));
  fallbackUI();
}
function speakTTS(text,slow){
  if(!synth||!text)return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/—/g,'.'));
  u.lang='fr-FR';if(voice)u.voice=voice;u.rate=slow?0.6:0.92;
  synth.speak(u);
}
function speak(text,slow){
  if(!text)return;
  if(player){player.pause();player=null}
  if(synth)synth.cancel();
  const a=new Audio('audio/'+akey(text)+'.mp3');player=a;
  a.playbackRate=slow?0.7:1;
  a.addEventListener('error',()=>{if(player!==a)return;player=null;fellBack=true;fallbackUI();speakTTS(text,slow)});
  const p=a.play();if(p&&p.catch)p.catch(()=>{});
}
if(synth){loadVoices();synth.addEventListener&&synth.addEventListener('voiceschanged',loadVoices);}
$('#voice').addEventListener('change',e=>{st.voice=e.target.value;voice=voices.find(v=>v.name===st.voice)||voice;save();speakTTS('Bonjour, bienvenue à Paris !')});

}

const objMarkup=o=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" aria-hidden="true"><rect class="qbg"/><g>'+o[4]+'</g></svg>';
function fitObj(svg,o){
  const crop=o[5];let b;
  try{b=crop?{x:crop[0],y:crop[1],width:crop[2],height:crop[3]}:svg.querySelector('g').getBBox()}catch(e){b={x:0,y:0,width:680,height:280}}
  if(!b.width||!b.height)b={x:0,y:0,width:680,height:280};
  let w=crop?b.width:b.width*1.3+16,hh=crop?b.height:b.height*1.3+16;
  if(w/hh<4/3)w=hh*4/3;else hh=w*3/4;
  const x=b.x+b.width/2-w/2,y=b.y+b.height/2-hh/2,bg=svg.querySelector('.qbg');
  svg.setAttribute('viewBox',[x,y,w,hh].join(' '));
  bg.setAttribute('x',x);bg.setAttribute('y',y);bg.setAttribute('width',w);bg.setAttribute('height',hh);
}

function enter(i){
  const len=DATA[i].steps.length;
  if(!(st.run&&st.run.i===i&&st.cur===i&&st.step<=len)){

    else{st.step=-1;newRun(i);st.combo=0}
  }
  save();setTab('jeu');window.scrollTo(0,0);

  let missed=false,revealed=false;
  const lock=()=>box.querySelectorAll('.opt,.tile,.check').forEach(b=>b.disabled=true);
  const win=(fr,zh,say)=>{lock();
    run.n++;if(p.t==='listen')run.earN++;

function renderQuiz(){
  picVis();

    const i=st.cur,prev=st.res[i],stars=starsFor(run.miss);

    if(!st.done.includes(i))st.done.push(i);

      c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),700);
      fb.replaceChildren(h('p',{class:'no'},'不是这一张，再试试。'));
    }

  };
  shuffle(sc.hots.map((o,k)=>k)).forEach(k=>{
    const c=h('button',{class:'qcard',type:'button','aria-label':'图片',onclick:()=>{
      Object.values(cardEl).forEach(x=>x.classList.remove('sel'));selP=k;c.classList.add('sel');judge();}});
    c.innerHTML=objMarkup(sc.hots[k])+'<span class="qlab fr" lang="fr"></span>';
    cardEl[k]=c;cards.append(c);});
  shuffle(sc.hots.map((o,k)=>k)).forEach(k=>{
    const ch=h('button',{class:'tile fr',lang:'fr',type:'button',onclick:()=>{
      Object.values(chipEl).forEach(x=>x.classList.remove('sel'));selW=k;ch.classList.add('sel');speak(sc.hots[k][0]);judge();}},sc.hots[k][0]);
    chipEl[k]=ch;chips.append(ch);});
  box.replaceChildren(h('p',{class:'count'},'小测试',comboEl()),h('p',{class:'ctx'},'把词和图配成对：先点一个词，再点它对应的图。'),chips,cards,fb);
  Object.keys(cardEl).forEach(k=>fitObj(cardEl[k].querySelector('svg'),sc.hots[k]));
}

  memoire:['记词','Mémoire','小测试里图和词一次配对的比例','Encyclopédiste','百科全书派','见过的词你都记得住，图和词一配就准，像狄德罗编百科全书那样把巴黎一样一样收进脑子里。'],

const QUART=[

   desc:'山坡、台阶、画架和小酒馆。毕加索年轻时就住在这里，这里适合想自己动手画点什么的人。'},
  {fr:'Ménilmontant',zh:'梅尼蒙当',arr:'第 20 区',stops:[5],title:['Rêveur · Rêveuse','沉思的漫步者'],
   desc:'巴黎东边的坡地，挨着拉雪兹神父公墓，安静，生活气息浓。这里适合喜欢一个人慢慢走、慢慢想的人。'}];
const quartOf=i=>QUART.find(q=>q.stops.includes(i));
function traits(){
  let ft=0,n=0,ear=0,earN=0,q=0,qn=0,found=0,real=0;
  st.done.forEach(i=>{const r=st.res[i];found+=(st.found[i]||[]).length;
    if(r&&!r.old){real++;ft+=r.ft;n+=r.n;ear+=r.ear;earN+=r.earN;q+=5-Math.min(5,r.qm);qn+=5}});
  const pc=(a,b)=>b?Math.round(100*a/b):null;
  return {real:real,v:{precision:pc(ft,n),oreille:pc(ear,earN),memoire:pc(q,qn),curiosite:pc(found,st.done.length*5)}};
}
/* how well one stop went, 0 to 1: half from what was brought home (stars), the rest from accuracy and from looking around */
function stopScore(i){
  if(!st.done.includes(i))return 0;
  const r=st.res[i],acc=r.old||!r.n?0.67:r.ft/r.n;
  return 0.5*r.stars/3+0.3*acc+0.2*(st.found[i]||[]).length/5;
}
const quartScores=()=>QUART.map(q=>({q:q,v:Math.round(100*q.stops.reduce((s,i)=>s+stopScore(i),0)/q.stops.length)})).sort((a,b)=>b.v-a.v);
function topSkill(tr){
  const v=tr.v,keys=['curiosite','oreille','memoire','precision'];
  if(keys.every(k=>v[k]!=null&&v[k]>=95))return ['Virtuose','全能型','四项都在 95 分以上：耳朵、记性、准确和好奇心，你一样不缺。'];
  let top=null;keys.forEach(k=>{if(v[k]!=null&&(top==null||v[k]>v[top]))top=k});
  if(!top)return null;
  const s=SKILL[top];return [s[3],s[4],'你最强的一项是“'+s[0]+'”。'+s[5]];
}

    h('p',{class:'scene'},intro),
    room,word,
    h('p',{class:'zh'},'已带回 '+n+' / '+N+' 件 · 三颗星添的东西 '+u+' / '+N+'。点房间里的东西可以听它的法语名字。'),
    h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:()=>{setTab('carte');window.scrollTo(0,0)}},n?'去地图，再带一件回来':'去地图，出门走走')),
    h('ol',{class:'chapters'},DATA.map((S,i)=>h('li',{},h('button',{type:'button',onclick:()=>enter(i)},
      h('span',{class:'cnum'+(have(i)?' done':'')},String(i+1)),
      h('span',{class:'cname'},have(i)?h('b',{lang:'fr'},ROOM[i].fr+'　',h('span',{lang:'zh'},ROOM[i].zh)):h('b',{},'？'),
        h('span',{},have(i)?(plus(i)?'来自'+S.place+'，三颗星还带回了 '+ROOM[i].up.fr+'（'+ROOM[i].up.zh+'）':'来自'+S.place+'。拿到三颗星，还能带回'+ROOM[i].up.zh):'走完“'+S.place+'”带回来')),
      have(i)?starEl(st.res[i].stars):h('span',{class:'zh'},'未去过'))))));
}

/* ---------- views ---------- */
function setTab(t){
  st.tab=t;save();
  ['chambre','carte','jeu','carnet','profil'].forEach(v=>{$('#'+v).hidden=v!==t});
  $('#tab-chambre').setAttribute('aria-selected',t==='chambre');
  $('#tab-carte').setAttribute('aria-selected',t==='carte'||t==='jeu');
  $('#tab-carnet').setAttribute('aria-selected',t==='carnet');
  $('#tab-profil').setAttribute('aria-selected',t==='profil');
  if(t==='chambre')renderRoom();else if(t==='carte')renderMap();else if(t==='jeu')renderStation(false);else if(t==='carnet')renderCarnet();else renderProfil();
}
$('#tab-chambre').addEventListener('click',()=>setTab('chambre'));
$('#tab-carte').addEventListener('click',()=>setTab('carte'));
$('#tab-carnet').addEventListener('click',()=>setTab('carnet'));
$('#tab-profil').addEventListener('click',()=>setTab('profil'));
$('#back').addEventListener('click',()=>setTab('carte'));
setTab(st.tab);
</script>
