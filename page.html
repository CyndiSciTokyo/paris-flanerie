  const th=thinker(),qs=quartScores(),best=qs[0].q,ready=st.done.length>=3,sk=topSkill(tr);
  const foundAll=Object.keys(st.found).reduce((s,k)=>s+st.found[k].length,0);
  const items=q=>q.stops.filter(i=>st.done.includes(i)).flatMap(i=>[ROOM[i].fr].concat(st.res[i].stars===3?[ROOM[i].up.fr]:[]));
  $('#profil').replaceChildren(
    h('h2',{},'我的巴黎 · Mon Paris'),
    h('div',{class:'typecard'},
      h('p',{class:'count'},'等级：',h('span',{lang:'fr'},rank[0]),' '+rank[1]+' · 星星 '+stars+' / '+max),
      ready?[h('p',{class:'zh'},all?'你适合住在':'目前看，你适合住在（所有地方走完后定下来）'),
          h('p',{class:'tfr',lang:'fr'},best.fr),h('p',{class:'tzh'},best.zh+'（巴黎'+best.arr+'）'),
          h('p',{},'称号：',h('b',{lang:'fr'},best.title[0]),'　'+best.title[1]),
          h('p',{},best.desc),
          h('p',{class:'zh'},'依据：你从这个街区带回了 ',h('span',{lang:'fr'},items(best).join('、')),'；在这里拿的星、答对的比例和图里点开的东西，合起来比别的街区高。'),
          sk&&h('p',{},'你的学法：',h('b',{lang:'fr'},sk[0]),'　'+sk[1]+'。'+sk[2])]
        :h('p',{},'再走完 '+(3-st.done.length)+' 个地方，这里会根据你带回的东西，告诉你适合住在巴黎的哪个街区。'),
      th&&h('p',{},'谈到人生的意义（你回答了 '+th.n+' 个问题）：',th.top.length===1
        ?['你更接近 ',h('b',{lang:'fr'},THINK[th.top[0]][0]),' '+THINK[th.top[0]][1]+'。'+THINK[th.top[0]][2]]
        :'你在'+th.top.map(k=>THINK[k][1]).join('、')+'之间，没有只站在哪一边。'),
      h('p',{class:'zh'},'等级看星星：'+Math.ceil(max/3)+' 颗升“常住客”，'+Math.ceil(max*2/3)+' 颗升“向导”，'+max+' 颗满星是“传奇”。')),
    h('h3',{},'各街区和你的契合度'),
    h('div',{class:'attrs'},qs.map(x=>{const q=x.q,d=q.stops.filter(i=>st.done.includes(i)).length;
      return [h('div',{class:'an'},h('b',{},q.zh+' ',h('span',{lang:'fr',style:'font-size:.9rem'},q.title[0])),h('span',{},'去过 '+d+' / '+q.stops.length+' 个地方 · '+q.title[1])),
        h('div',{class:'bar',role:'img','aria-label':q.zh+' '+x.v+' 分'},h('i',{style:'width:'+x.v+'%'})),h('div',{class:'av'},String(x.v))]})),
    h('p',{class:'zh'},'每个街区的分数，一半看你在那里带回了多少东西（星星），其余看答对的比例和图里点开了多少东西；没去过的地方算零分。'),
    h('h3',{},'四项属性'),
    h('div',{class:'attrs'},Object.keys(SKILL).map(k=>{const s=SKILL[k],x=tr.v[k];
      return [h('div',{class:'an'},h('b',{},s[0]+' ',h('span',{lang:'fr',style:'font-size:.9rem'},s[1])),h('span',{},s[2])),
        h('div',{class:'bar',role:'img','aria-label':s[0]+(x==null?' 暂无':' '+x+' 分')},h('i',{style:'width:'+(x||0)+'%'})),h('div',{class:'av'},x==null?'—':String(x))]})),
    h('p',{class:'zh'},'最长连对 '+st.best+' 次 · 图里点开过的东西 '+foundAll+' / '+N*5+' · 房间里的东西 '+st.done.length+' / '+N+'。'),
    h('div',{class:'row'},h('button',{class:'tile',type:'button',onclick:()=>setTab('chambre')},'去看我的房间')));
}

/* small helpers */
const deaccent=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/Œ/g,'OE');
const sameWord=(a,b,strict)=>{const n=x=>x.trim().toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ');return strict?n(a)===n(b):deaccent(n(a))===deaccent(n(b))};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* play letters one after another (used to spell a word aloud) */
async function speakLetters(word){
  const seq=[...deaccent(word).toUpperCase()].filter(c=>/[A-Z]/.test(c));
  for(const c of seq){
    if(player){player.pause();player=null}
    await new Promise(res=>{const a=new Audio('audio/'+akey(c)+'.mp3');player=a;
      a.addEventListener('ended',res);a.addEventListener('error',()=>{speakTTS(c);setTimeout(res,700)});
      const p=a.play();if(p&&p.catch)p.catch(()=>res());});
    await sleep(160);
  }
}
const letterChip=c=>{const L=BASE.alpha.find(x=>x.l===deaccent(c).toUpperCase());
  return h('span',{class:'lchip'},h('b',{lang:'fr'},c),L?h('span',{lang:'fr'},L.name):null,L?h('small',{},L.py):null)};

/* spelling: compare letter by letter and explain the usual French traps */
function spellDiff(typed,ans,strict){
  const a=[...ans],t=[...typed.toLowerCase()];const A=a.map(x=>x.toLowerCase());
  const m=a.length,n=t.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=deaccent(A[i])===deaccent(t[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keep=new Array(m).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(deaccent(A[i])===deaccent(t[j])){keep[i]=!strict||A[i]===t[j];i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return h('span',{class:'fr diff',lang:'fr'},a.map((c,k)=>h('span',{class:keep[k]?'':'miss'},c)));
}
function spellHint(typed,ans){
  const t=deaccent(typed.toLowerCase()),a=deaccent(ans.toLowerCase()),hints=[];
  if(a.startsWith('h')&&!t.startsWith('h'))hints.push('h 不发音，但要写出来。');
  if(/[stxdzp]$/.test(a)&&t===a.slice(0,-1))hints.push('词尾这个辅音不发音，但要写出来。');
  if(/eau|au/.test(a)&&!/eau|au/.test(t)&&/o/.test(t))hints.push('o 这个音还可以写成 au 或 eau。');
  if(/ou/.test(a)&&!/ou/.test(t))hints.push('“乌”的音写成 ou。');
  if(/ch/.test(a)&&!/ch/.test(t))hints.push('“sh”的音写成 ch。');
  if(/ill/.test(a)&&!/ill/.test(t))hints.push('“yi”的音常写成 ill。');
  if(/ph/.test(a)&&!/ph/.test(t))hints.push('f 的音有时写成 ph。');
  if(/[aeiouy]s[aeiouy]/.test(a)&&/z/.test(t)&&!/z/.test(a))hints.push('两个元音之间的 s 读 z，但还是写成 s。');
  if(/ai|ei/.test(a)&&!/ai|ei/.test(t)&&/[eé]/.test(t))hints.push('“欸”的音常写成 ai 或 ei。');
  if(/qu/.test(a)&&!/qu/.test(t))hints.push('k 的音在 i、e 前常写成 qu。');
  if(/[éèêëàâçôûùîïœ]/.test(ans)&&t===a&&typed.toLowerCase()!==ans.toLowerCase())hints.push('字母都对了，注意重音符号。');
  return hints;
}

          !sameWord(v,q.fr,true)?h('p',{class:'zh'},'字母都对。注意重音符号：'+q.fr):null])}
        else{const hs=spellHint(v,q.fr);tried=true;fb.replaceChildren(h('p',{class:'no'},'还不对。标红的是你漏掉或写错的地方：'),h('p',{},spellDiff(v,q.fr,strict)),
          ...hs.map(x=>h('p',{class:'note'},x)),h('div',{class:'row'},h('button',{class:'tile',type:'button',onclick:()=>{inp.value='';inp.focus()}},'清空重写')))}}},'检查');
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')check.click()});
      kids.push(h('p',{class:'ctx'},'听写：把听到的词拼出来。'+(strict?'（进阶：重音符号也要对）':'（入门：先不计较重音符号）')),
        h('div',{class:'line'},spk(q.fr,true)),inp,bar,h('div',{class:'row'},check,h('button',{class:'tile',type:'button',onclick:()=>speakLetters(q.fr)},'听字母拼读（提示）')));
      if(acted)setTimeout(()=>speak(q.fr),200);
    }
    kids.push(fb);box.replaceChildren(...kids);
  }
  go();
}

/* ---------- course pages ---------- */
function renderBasics(){
  const box=$('#basics'),cur=st.bopen;
  if(cur){const L=COURSE.find(c=>c.id===cur);if(L&&L.ready)return openLesson(cur,st.bphase||'learn');}
  const passed=COURSE.filter(c=>bstat(c.id)&&bstat(c.id).passed).length;
  box.replaceChildren(
    h('h2',{},'从零开始 · Les bases'),
    h('p',{class:'scene'},'没学过法语也没关系。这里从字母和发音开始，一课一课学会最基础的单词和语法。每课先学、再练、最后小测，答对八成算通过。不学这部分也可以直接去漫步巴黎，这里只是推荐。'),
    h('p',{class:'zh'},'已通过 '+passed+' / '+COURSE.length+' 课。'+(passed===COURSE.length?'全部学完了，恭喜结业！':'')),
    h('div',{class:'row'},h('span',{class:'zh'},'拼写要求：'),
      h('button',{class:'tile'+(st.spellStrict?'':' on'),type:'button',onclick:()=>{st.spellStrict=false;save();renderBasics()}},'入门：先不计较重音符号'),
      h('button',{class:'tile'+(st.spellStrict?' on':''),type:'button',onclick:()=>{st.spellStrict=true;save();renderBasics()}},'进阶：符号也要对')),
    h('ol',{class:'chapters'},COURSE.map(c=>{const s=bstat(c.id);
      return h('li',{},h('button',{type:'button',disabled:!c.ready,onclick:()=>{st.bopen=c.id;st.bphase='learn';save();openLesson(c.id,'learn');window.scrollTo(0,0)}},
        h('span',{class:'cnum'+(s&&s.passed?' done':'')},c.id),
        h('span',{class:'cname'},h('b',{},c.title),h('span',{},c.sub)),
        h('span',{class:'zh'},!c.ready?'准备中':s&&s.passed?'已通过 · 最好 '+s.best+' 分':s?'最好 '+s.best+' 分':'未开始')))})));
}
function lessonHead(id){
  const L=COURSE.find(c=>c.id===id);
  return [h('button',{class:'back',type:'button',onclick:()=>{st.bopen=null;save();renderBasics();window.scrollTo(0,0)}},'← 课程表'),
    h('p',{class:'count'},'第 '+id+' 课'),h('h2',{},L.title)];
}
function finish(id,score,total){
  const pct=score/total,rec=(st.basics=st.basics||{})[id]||(st.basics[id]={passed:false,best:0});
  rec.best=Math.max(rec.best,Math.round(pct*100));if(pct>=PASS)rec.passed=true;st.bphase='learn';save();
  const i=COURSE.findIndex(c=>c.id===id),nxt=COURSE[i+1];
  $('#basics').replaceChildren(...lessonHead(id),
    h('p',{class:'bigstars'},Math.round(pct*100)+' 分'),
    h('p',{},pct>=PASS?(id==='12'?'通过了！基础课全部结束，恭喜结业。你已经会打招呼、数数、问路、点菜、说过去和将来的事，可以出发去巴黎了。':'通过了！'):'这次没到 80 分。回去看看“学”的部分，再测一次。'),
    h('div',{class:'row'},
      pct>=PASS&&nxt&&nxt.ready?h('button',{class:'primary',type:'button',onclick:()=>{st.bopen=nxt.id;save();openLesson(nxt.id,'learn');window.scrollTo(0,0)}},'下一课：'+nxt.title):null,
      pct>=PASS&&(id==='1'||id==='12')?h('button',{class:'primary',type:'button',onclick:()=>{st.bopen=null;save();setTab('carte')}},'去漫步巴黎试试'):null,
      h('button',{class:'tile',type:'button',onclick:()=>openLesson(id,'learn')},'回到这一课'),
      h('button',{class:'tile',type:'button',onclick:()=>openLesson(id,'quiz')},'再测一次')));
}
const pick=(arr,n)=>shuffle(arr).slice(0,n);
function openLesson(id,phase){
  st.bopen=id;st.bphase=phase;save();
  const box=$('#basics');
  const startBtns=()=>h('div',{class:'row'},
    h('button',{class:'primary',type:'button',onclick:()=>{openLesson(id,'practice');window.scrollTo(0,0)}},'开始练习'),
    h('button',{class:'tile',type:'button',onclick:()=>openLesson(id,'quiz')},'直接小测'));
  const sets={
    '0':{practice:()=>pick(BASE.alpha,8).map(x=>({t:'letter',l:x.l})).concat(pick(BASE.spelled,3).map(w=>({t:'spelled',fr:w}))),
         quiz:()=>shuffle(pick(BASE.alpha,7).map(x=>({t:'letter',l:x.l})).concat(pick(BASE.spelled,3).map(w=>({t:'spelled',fr:w}))))},
    '0.5':{practice:()=>pick(BASE.pron,3).concat(pick(BASE.hear,3),pick(BASE.silent,3),pick(BASE.dict05,3)),
         quiz:()=>shuffle(pick(BASE.pron,3).concat(pick(BASE.hear,2),pick(BASE.silent,2),pick(BASE.dict05,3)))},
  };
  const LD=BASE['l'+id];
  /* practice keeps at most a few of each kind of question, in the lesson's order */
  const capped=()=>{const cap={numhear:4,sort:1},keep=new Set();
    [...new Set(LD.items.map(q=>q.t))].forEach(tp=>pick(LD.items.filter(q=>q.t===tp),cap[tp]||3).forEach(q=>keep.add(q)));
    return LD.items.filter(q=>keep.has(q)&&q.t!=='spell').concat(LD.items.filter(q=>keep.has(q)&&q.t==='spell'))};
  const S=sets[id]||{practice:capped,
         quiz:()=>{const s=pick(LD.items.filter(q=>q.t==='sort'),1);return shuffle(pick(LD.items.filter(q=>q.t!=='sort'),10-s.length).concat(s))}};
  if(phase==='afterPractice'){
    box.replaceChildren(...lessonHead(id),h('p',{},'练习做完了。准备好就做小测：10 道题，答对 8 道算通过。'),
      h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:()=>openLesson(id,'quiz')},'开始小测'),
        h('button',{class:'tile',type:'button',onclick:()=>openLesson(id,'learn')},'再看看“学”的部分')));
    return;
  }
  if(phase==='quiz'||phase==='practice'){
    const isQuiz=phase==='quiz';
    runSet(isQuiz?'小测':'练习',isQuiz?S.quiz():S.practice(),(sc,n)=>isQuiz?finish(id,sc,n):openLesson(id,'afterPractice'));
    return;
  }
  /* learn */
  if(id==='0'){
    const nameOut=h('div',{class:'row'}),nameIn=h('input',{type:'text',class:'spellin',placeholder:'输入你的名字（拼音或英文）',autocomplete:'off','aria-label':'你的名字'});
    const showName=()=>nameOut.replaceChildren(...[...nameIn.value].filter(c=>/[a-zà-ÿ]/i.test(c)).map(letterChip));
    nameIn.addEventListener('input',showName);
    box.replaceChildren(...lessonHead(id),
      h('p',{class:'scene'},'法语用和英语一样的 26 个字母，但念法不同。点一个字母，听它的法语念法。拼音只是近似，最准的还是录音。'),
      h('div',{class:'note'},h('p',{},'三个最要紧的提醒：'),h('p',{},'1. p、t、k 不送气，听起来更像拼音的 b、d、g。'),h('p',{},'2. b、d、g 是浊音，声带要振动，普通话里没有。'),h('p',{},'3. z 是英语 zoo 的 z；u 是“鱼”的口型；r 在喉咙里。')),
      h('div',{class:'lgrid'},BASE.alpha.map(L=>h('button',{class:'ltile',type:'button',onclick:()=>speak(L.say)},
        h('span',{class:'lbig',lang:'fr'},L.l+' '+L.l.toLowerCase()),h('span',{class:'lname fr',lang:'fr'},L.name),h('span',{class:'lpy'},L.py),
        L.note?h('span',{class:'lnote'},L.note):null,h('span',{class:'lex'},h('span',{lang:'fr'},L.ex.fr),' '+L.ex.zh)))),
      h('p',{class:'zh'},'点字母听它的名字；想听例词，点下面这排。'),
      h('div',{class:'row'},BASE.alpha.map(L=>h('button',{class:'tile fr',lang:'fr',type:'button',onclick:()=>speak(L.ex.fr)},L.ex.fr))),
      h('h3',{},'带符号的字母'),
      h('p',{class:'scene'},'法语有几个带符号的字母。拼单词时，符号要说出来，比如 é 说“e accent aigu”。'),
      h('ul',{class:'entries'},BASE.accents.map(a=>h('li',{},h('div',{class:'line'},h('b',{class:'fr',lang:'fr',style:'font-size:1.4rem'},a.l),h('span',{lang:'fr'},a.name),h('span',{class:'zh'},'读 '+a.py+(a.note?'。'+a.note:''))),
        h('div',{class:'line'},h('span',{class:'fr',lang:'fr'},a.ex.fr),spk(a.ex.fr),h('span',{class:'zh'},a.ex.zh))))),
      h('h3',{},'拼出你的名字'),
      h('p',{class:'scene'},'在法国订座、登记时，常常要一个字母一个字母地拼出名字。输进去，看看每个字母怎么念，再点“听拼读”。'),
      nameIn,nameOut,h('div',{class:'row'},h('button',{class:'tile',type:'button',onclick:()=>speakLetters(nameIn.value)},'听拼读')),
      startBtns());
    return;
  }
  if(id==='0.5'){
    box.replaceChildren(...lessonHead(id),
      h('p',{class:'scene'},'法语的拼写看起来复杂，其实规律性很强。记住下面的组合和七条规则，大部分新单词你看一眼就能读出来。'),
      h('h3',{},'字母组合'),
      h('ul',{class:'entries'},BASE.combos.map(c=>h('li',{},h('div',{class:'line'},h('b',{class:'fr',lang:'fr',style:'min-width:7em;display:inline-block'},c.w),h('span',{},c.py)),
        h('div',{class:'line'},h('span',{class:'fr',lang:'fr'},c.fr),spk(c.fr),h('span',{class:'zh'},c.zh))))),
      h('h3',{},'七条规则'),
      ...BASE.rules.map((r,i)=>h('div',{class:'stop'},h('p',{},h('b',{},(i+1)+'. '+r.t)),h('p',{class:'zh'},r.d),
        h('div',{class:'row'},r.ex.map(e=>h('span',{class:'line'},h('span',{class:'fr',lang:'fr'},e.fr),spk(e.fr),h('span',{class:'zh'},e.zh)))))),
      h('p',{class:'note'},'练习里会有：看词选读音、听音选拼写、找出不发音的字母，还有听写。'),
      startBtns());
    return;
  }
  if(LD){
    const G=LD.gram;
    box.replaceChildren(...lessonHead(id),
      h('p',{class:'scene'},LD.intro||'先把单词都点开听一遍，跟着读。'),
      h('h3',{},'这一课的词'),h('ul',{class:'entries vocab'},LD.vocab.map(v=>h('li',{},frLine(v.fr,v.zh)))),
      h('h3',{},'语法：'+G.title),
      /* the table goes right after the paragraph that introduces it */
      ...G.text.slice(0,(G.tableAt||0)+1).map(x=>h('p',{class:'scene'},x)),
      h('ul',{class:'entries vocab'},G.table.map(v=>h('li',{},frLine(v.fr,v.zh)))),
      ...G.text.slice((G.tableAt||0)+1).map(x=>h('p',{class:'scene'},x)),
      h('h3',{},'例句'),h('ul',{class:'entries'},G.ex.map(v=>h('li',{},frLine(v.fr,v.zh)))),
      startBtns());
  }
}

/* ---------- views ---------- */
function setTab(t){
  st.tab=t;save();
  ['basics','chambre','carte','jeu','carnet','profil'].forEach(v=>{$('#'+v).hidden=v!==(t==='base'?'basics':t)});
  $('#tab-base').setAttribute('aria-selected',t==='base');
  $('#tab-chambre').setAttribute('aria-selected',t==='chambre');
  $('#tab-carte').setAttribute('aria-selected',t==='carte'||t==='jeu');
  $('#tab-carnet').setAttribute('aria-selected',t==='carnet');
  $('#tab-profil').setAttribute('aria-selected',t==='profil');
  if(t==='base')renderBasics();else if(t==='chambre')renderRoom();else if(t==='carte')renderMap();else if(t==='jeu')renderStation(false);else if(t==='carnet')renderCarnet();else renderProfil();
}
$('#tab-base').addEventListener('click',()=>{st.bopen=null;setTab('base')});
$('#tab-chambre').addEventListener('click',()=>setTab('chambre'));
$('#tab-carte').addEventListener('click',()=>setTab('carte'));
$('#tab-carnet').addEventListener('click',()=>setTab('carnet'));
$('#tab-profil').addEventListener('click',()=>setTab('profil'));

setTab(st.tab);
</script>
