<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>巴黎文艺漫步</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Caveat:wght@500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one narrow column, like walking a single street. A métro-style route line on top,
   then a Paris enamel street plaque naming the stop, then the conversation. */
:root{
  --bg:#eceff3; --surface:#f9fafc; --ink:#1a2233; --muted:#586275; --line:#cfd5de;
  --enamel:#1b3f94; --enamel-ink:#ffffff; --frame:#2f6b4f; --accent:#1b3f94;
  --ok:#2a6549; --ok-bg:#dfeee6; --bad:#a9342c; --bad-bg:#f6e1df;
  --water:#a9c2dd; --park:#cfe0cf; --gold:#a8770a;
  --f-plaque:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-fr:'Spectral',Georgia,'Times New Roman',serif;
  --f-ui:system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141d; --surface:#18202d; --ink:#e7eaf0; --muted:#9aa5b8; --line:#2d3748;
  --enamel:#2449a6; --enamel-ink:#ffffff; --frame:#3f8c68; --accent:#93adf2;
  --ok:#6cc097; --ok-bg:#17302a; --bad:#ec857c; --bad-bg:#3a1f1f;
  --water:#2c476b; --park:#243d31; --gold:#e6b94a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#18202d; --ink:#e7eaf0; --muted:#9aa5b8; --line:#2d3748;
  --enamel:#2449a6; --enamel-ink:#ffffff; --frame:#3f8c68; --accent:#93adf2;
  --ok:#6cc097; --ok-bg:#17302a; --bad:#ec857c; --bad-bg:#3a1f1f;
  --water:#2c476b; --park:#243d31; --gold:#e6b94a; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-ui)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{margin:0;font-size:1.25rem;font-weight:600}
h1 span{font:italic 400 1rem var(--f-fr);color:var(--muted);margin-left:8px}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}

/* street plaque */
.plaque-wrap{display:inline-flex;flex-direction:column;align-items:center;align-self:flex-start;max-width:100%}
.arr{background:var(--enamel);color:var(--enamel-ink);border:3px solid var(--frame);border-bottom:0;
  border-radius:40px 40px 0 0;padding:3px 18px 1px;font:600 .85rem var(--f-plaque);letter-spacing:.1em}
.plaque{background:var(--enamel);color:var(--enamel-ink);border:3px solid var(--frame);border-radius:4px;
  padding:8px 22px 10px;font:600 clamp(1.5rem,6.5vw,2.3rem)/1.08 var(--f-plaque);text-transform:uppercase;
  letter-spacing:.05em;text-align:center;text-wrap:balance}
.place{font-size:.9rem;color:var(--muted)}
.place b{color:var(--ink);font-weight:600}
.scene{max-width:62ch}

.view{display:flex;flex-direction:column;gap:20px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--accent);font-size:.95rem}
#map svg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
#map .road{stroke:var(--line);fill:none;stroke-width:2}
#map .water{stroke:var(--water);fill:none;stroke-width:18;stroke-linecap:round}
#map .isle{fill:var(--surface)}
#map .park{fill:var(--park)}
#map .maptxt{fill:var(--muted);font:600 12px var(--f-plaque);letter-spacing:.22em}
.pin{cursor:pointer;outline:none}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--enamel);stroke:var(--surface);stroke-width:3}
.pin.done .dot{fill:var(--frame)}
.pin.gold .dot{stroke:var(--gold)}
.pin:hover .dot,.pin:focus-visible .dot{stroke:var(--accent);stroke-width:5}
.pin .num{fill:var(--enamel-ink);font:600 17px var(--f-plaque);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .lab{fill:var(--ink);font:500 15px var(--f-fr);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
@media (max-width:520px){.pin .lab{display:none}}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chapters button{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.chapters button:hover .cname b{color:var(--accent)}
.cnum{width:30px;height:30px;border-radius:50%;background:var(--enamel);color:var(--enamel-ink);display:flex;align-items:center;justify-content:center;font:600 .95rem var(--f-plaque)}
.cnum.done{background:var(--frame)}
.cname{display:flex;flex-direction:column;min-width:0}
.cname span{color:var(--muted);font-size:.9rem}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.bigstars{font-size:2rem;line-height:1}
.combo{color:var(--gold)}
.souv{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:560px){.souv{grid-template-columns:repeat(4,1fr)}}
.scard{display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;min-width:0}
.scard svg{display:block;width:100%;height:auto}
.scard .qbg{fill:#b9c6d6}
.scard .qlab{min-height:2em;display:flex;align-items:center;justify-content:center;font-size:.9rem;padding:2px;text-align:center}
.scard.gold{border-color:var(--gold)}
.scard.lock{align-items:center;justify-content:center;aspect-ratio:1;color:var(--muted);font:600 1.4rem var(--f-plaque);border-style:dashed}
.keep{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.typecard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.typecard .tfr{font:500 clamp(1.5rem,6vw,2.1rem)/1.15 var(--f-fr);text-wrap:balance}
.typecard .tzh{font-weight:600}
.attrs{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:10px 12px;align-items:center}
.attrs .an{display:flex;flex-direction:column;line-height:1.3}
.attrs .an span{color:var(--muted);font-size:.8rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.attrs .av{text-align:right;font-variant-numeric:tabular-nums}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:20px 14px;padding:6px 4px}
.polaroid{margin:0;padding:7% 7% 0;border-radius:2px;transform:rotate(var(--r,0deg));display:flex;flex-direction:column;min-width:0;transition:transform .2s;
  /* aged instant-film paper: yellowed cream, a few foxing stains, fibre grain, darker edges */
  background:
    radial-gradient(ellipse 40% 30% at 82% 88%,rgba(150,115,55,.20),transparent 70%),
    radial-gradient(ellipse 30% 22% at 12% 8%,rgba(150,115,55,.14),transparent 70%),
    radial-gradient(circle 3px at 70% 93%,rgba(120,90,40,.35),transparent),
    radial-gradient(circle 2px at 24% 90%,rgba(120,90,40,.30),transparent),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    linear-gradient(170deg,#f4eedd,#e9dfc6);
  box-shadow:0 1px 2px rgba(0,0,0,.28),0 6px 14px rgba(0,0,0,.16),inset 0 0 22px rgba(125,98,50,.22),inset 0 0 0 1px rgba(255,255,255,.4)}
.polaroid img,.polaroid .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#1d1c1a;border:1px solid rgba(40,32,20,.45);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.polaroid .ph svg{display:block;width:100%;height:100%}
.polaroid figcaption{font:500 1.15rem/1.15 'Caveat','Bradley Hand','Segoe Print',cursive;color:#3a3646;padding:8px 2px 14px;text-align:center;min-height:2.7em;display:flex;align-items:center;justify-content:center}
.album .polaroid[role="button"]{cursor:pointer}
.album .polaroid[role="button"]:hover,.album .polaroid[role="button"]:focus-visible{transform:rotate(0deg) scale(1.04);outline:2px solid var(--accent);outline-offset:3px}
.polaroid.empty{background:transparent;box-shadow:none;border:1px dashed var(--line)}
.polaroid.empty .ph{background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font:600 1.6rem var(--f-plaque)}
.polaroid.empty figcaption{font:400 .8rem var(--f-ui);color:var(--muted)}
.photo{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:560px){.photo{grid-template-columns:minmax(0,1fr)}}
.photo .polaroid{max-width:230px}
.photo .story{display:flex;flex-direction:column;gap:8px;min-width:0}
.develop img{animation:develop 4s ease-out both}
@keyframes develop{from{filter:grayscale(1) brightness(1.9) contrast(.45)}to{filter:none}}
@media (prefers-reduced-motion:reduce){.develop img{animation:none}}
.storylines li.cur .fr{color:var(--accent)}
.cloze{display:flex;flex-direction:column;gap:12px;max-width:65ch}
.cloze p{margin:0;line-height:2.1}
.gap{display:inline-block;min-width:4.5em;padding:0 8px;margin:0 2px;border:0;border-bottom:2px solid var(--accent);background:var(--surface);border-radius:4px 4px 0 0;font:inherit;color:var(--accent);line-height:1.5}
.gap.sel{outline:2px solid var(--accent);outline-offset:1px}
.gap.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.gap.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.bank{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)}
.bank .tile[hidden]{display:none}
.picbox{display:flex;flex-direction:column;gap:6px}
#room svg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.ritem:hover,.ritem:focus-visible{filter:brightness(1.1)}
#pic svg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.hot{cursor:pointer;outline:none}
.hot .mk{fill:#ffffff;stroke:#1b3f94;stroke-width:2.5}
.hot .mkdot{fill:#1b3f94}
.hot.found .mk{stroke:#2f6b4f}
.hot.found .mkdot{fill:#2f6b4f}
.hot:hover .mk,.hot:focus-visible .mk,.hot.sel .mk{stroke-width:5}
#word:empty{display:none}
.quiz{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:560px){.quiz{grid-template-columns:repeat(3,1fr)}}
.qcard{display:flex;flex-direction:column;padding:0;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:10px;min-width:0}
.qcard svg{display:block;width:100%;height:auto}
.qcard .qbg{fill:#b9c6d6}
.qcard .qlab{min-height:2.2em;display:flex;align-items:center;justify-content:center;font-size:1rem;padding:2px 4px;text-align:center}
.qcard:hover:not(:disabled){border-color:var(--accent)}
.qcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.qcard.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.qcard.bad{border-color:var(--bad);background:var(--bad-bg)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fr{font-family:var(--f-fr);font-size:1.2rem;line-height:1.45}
.zh{color:var(--muted);font-size:.9rem}
.count{font:600 .8rem var(--f-plaque);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#step{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:16px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.bubble .who{font:600 .8rem var(--f-plaque);letter-spacing:.1em;text-transform:uppercase;color:var(--frame)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.line > .fr{min-width:0}
.ctx{font-weight:600}

.spk{display:inline-flex;gap:4px;flex:none}
.spk button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);
  border-radius:999px;padding:4px 9px;font-size:.8rem;color:var(--accent);line-height:1}
.spk button:hover{border-color:var(--accent)}
.spk.big .spk-b{background:var(--enamel);border-color:var(--enamel);color:var(--enamel-ink);padding:9px 16px;font-size:.95rem}
.spk.big .spk-s{padding:9px 12px}
.reveal{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.9rem;align-self:flex-start}

.opts{display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.opt{flex:1;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.75}
.opt:disabled{cursor:default}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills .opt{flex:none}

.slot,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;align-items:center}
.slot{border-bottom:2px solid var(--line);padding-bottom:8px}
.slot:empty::before{content:"点下面的词，拼出这句话";color:var(--muted);font-size:.9rem}
.tile{background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:6px 12px}
.tile[disabled]{visibility:hidden}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.primary{background:var(--enamel);color:var(--enamel-ink);border:0;border-radius:8px;padding:10px 20px;font-weight:600}
.primary:disabled{opacity:.45;cursor:default}

.entries.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media (max-width:560px){.entries.vocab{grid-template-columns:minmax(0,1fr)}}
.recall{border-top:1px solid var(--line);padding-top:12px}
.recall summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.recall[open] summary{margin-bottom:14px}
.recall .lesson{display:flex;flex-direction:column;gap:14px}
.lesson{display:flex;flex-direction:column;gap:14px}
.fb{display:flex;flex-direction:column;gap:8px}
.fb:empty{display:none}
.fb .ok{color:var(--ok);font:500 1.15rem var(--f-fr)}
.fb .no{color:var(--bad);font-size:.95rem}
.note{border-left:3px solid var(--frame);padding-left:12px;font-size:.95rem;max-width:60ch}

h2{margin:0;font-size:1.1rem}
h3{margin:0;font:600 1rem var(--f-plaque);letter-spacing:.08em;text-transform:uppercase;color:var(--frame)}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.entries li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stop{display:flex;flex-direction:column;gap:8px}
.locked{color:var(--muted);font-size:.9rem}
.warn{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;font-size:.9rem}
.voice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.voice select{font:inherit;max-width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
</style>

<div class="wrap">
  <header>
    <h1>巴黎文艺漫步<span>Flânerie à Paris</span></h1>
    <div class="tabs" role="tablist">
      <button id="tab-chambre" role="tab" type="button">房间</button>
      <button id="tab-carte" role="tab" type="button">地图</button>
      <button id="tab-carnet" role="tab" type="button">手帐</button>
      <button id="tab-profil" role="tab" type="button">我的巴黎</button>
    </div>
  </header>
  <p id="warn" class="warn" hidden>录音文件没有加载出来，这台设备上也没有检测到法语语音，发音按钮可能没有声音。Mac 上可以在"系统设置 → 辅助功能 → 朗读内容 → 系统语音 → 管理语音"里添加法语（推荐 Amélie 或 Thomas），然后刷新本页。</p>

  <main id="chambre" class="view" hidden></main>

  <main id="carte" class="view" hidden>
    <div id="map"></div>
    <p class="zh" id="mapsum"></p>
    <ol class="chapters" id="chapters"></ol>
  </main>

  <main id="jeu" class="view" hidden>
    <button class="back" id="back" type="button">← 回到地图</button>
    <div class="plaque-wrap"><div class="arr" id="arr"></div><div class="plaque" id="plaque"></div></div>
    <p class="place" id="place"></p>
    <div class="picbox">
      <div id="pic"></div>
      <p class="zh" id="pichint"></p>
      <div id="word" aria-live="polite"></div>
    </div>
    <p class="scene" id="scene"></p>
    <section id="step"></section>
  </main>

  <main id="carnet" class="view" hidden></main>

  <main id="profil" class="view" hidden></main>

  <div class="voice" id="voicebox" hidden>
    <label for="voice">录音没加载出来，改用设备语音</label>
    <select id="voice"></select>
    <span class="spk"><button type="button" id="voicetest">试听</button></span>
  </div>
</div>

<script>
const DATA=[
{plaque:"Quai de Conti",arr:"6e Arr.",place:"塞纳河畔的旧书摊",frPlace:"Les bouquinistes",who:"Le bouquiniste",
 scene:"周六上午十点，你沿着塞纳河左岸走。河堤上一排墨绿色的铁皮箱子打开着，这是巴黎的旧书摊，已经摆了四百多年。一位戴贝雷帽的老先生抬头看见了你。任务：买到一本波德莱尔的《恶之花》。",
 steps:[
  {t:"listen",fr:"Bonjour ! Vous cherchez quelque chose ?",q:"老先生在问什么？",opts:["您在找什么东西吗？","您想喝点什么吗？","您是从哪里来的？"],
   note:"chercher 是“找”。vous 是“您”，对陌生人都用它；熟人之间才用 tu。"},
  {t:"build",ctx:"告诉他：您好，我在找一本波德莱尔的书。",tokens:["Bonjour,","je","cherche","un","livre","de","Baudelaire."],extra:["une"],
   zh:"您好，我在找一本波德莱尔的书。",note:"Je cherche… 是“我在找……”。livre（书）是阳性词，所以“一本”用 un。"},
  {t:"fill",npc:["Ah, Les Fleurs du mal ! Voilà.","啊，《恶之花》！给您。"],ctx:"他把书递给你，又补了一句。选出正确的词：",before:"C'est ",after:" belle édition.",opts:["une","un","des"],
   full:"C'est une belle édition.",zh:"这是一个很漂亮的版本。",note:"édition 是阴性词，用 une。小窍门：以 -tion 结尾的词几乎都是阴性。"},
  {t:"choose",ctx:"你想问价钱，该怎么说？",opts:[["C'est combien, s'il vous plaît ?","请问多少钱？"],["C'est où, s'il vous plaît ?","请问在哪里？"],["C'est qui ?","这是谁？"]],
   note:"combien 是“多少”，où 是“哪里”，qui 是“谁”。s'il vous plaît 加在句尾就很客气。"},
  {t:"listen",fr:"Douze euros.",q:"这本书多少钱？",opts:["12 欧元","2 欧元","20 欧元"],

,{plaque:"Rue de la Verrerie",arr:"4e Arr.",place:"玛黑区的中古店",frPlace:"Une friperie du Marais",who:"La vendeuse",
 scene:"玛黑区的老街上，中古服装店一家挨着一家。法国人把淘旧货叫 chiner，这是很多巴黎人周末的消遣。你推开一扇挂着铃铛的门，衣架上挤满了几十年前的夹克和裙子。任务：看中一件皮夹克，试穿，然后买下来。",
 steps:[
  {t:"listen",fr:"Bonjour ! Tout est d'occasion ici, regardez !",q:"店员说了什么？",opts:["您好！这里的东西都是二手的，随便看！","您好！这里的东西都是新到的，随便看！","您好！我们马上关门了！"],
   note:"d'occasion 是“二手的”。tout 是“全部”。regardez 是 regarder（看）对“您”说的形式。"},
  {t:"build",ctx:"你看中了一件：我喜欢这件皮夹克。",tokens:["J'aime","cette","veste","en","cuir."],extra:["ce"],
   zh:"我喜欢这件皮夹克。",note:"veste 是阴性词，所以“这件”用 cette。说材质用 en：en cuir（皮的），en laine（羊毛的）。"},
  {t:"choose",ctx:"你想试穿这件夹克，怎么问？",opts:[["Je peux l'essayer ?","我可以试试它吗？"],["Je peux la manger ?","我可以吃它吗？"],["Je peux payer ?","我可以付钱了吗？"]],
   note:"l' 在这里代替 la veste。因为 essayer 以元音开头，la 缩成了 l'。"},
  {t:"listen",fr:"Bien sûr ! La cabine est au fond, à gauche.",q:"店员怎么回答？",opts:["当然！试衣间在最里面，左手边。","当然！试衣间在楼上，右手边。","抱歉，试衣间坏了。"],
   note:"au fond 是“在最里面”。à gauche（左边）在奥赛那一站学过。"},
  {t:"fill",ctx:"夹克有点大，但你决定买下。veste 是阴性词。",before:"Elle est un peu grande, mais je ",after:" prends.",opts:["la","le","les"],
   full:"Elle est un peu grande, mais je la prends.",zh:"它有点大，不过我要了。",note:"用 la 代替 la veste，放在动词 prends 前面。买东西时说一句 Je le prends 或 Je la prends 就是“我要了”。"}

 gram:"刚提到的东西用 le、la、les 代替，放在动词前：Je la prends。元音前缩成 l'：Je peux l'essayer ?"}
,{plaque:"Boulevard du Montparnasse",arr:"14e Arr.",place:"圆顶咖啡馆，遇见萨特",frPlace:"La Coupole",who:"Jean-Paul",voice:"m",
 scene:"蒙帕纳斯大道上的圆顶咖啡馆 1927 年开张，萨特和波伏瓦都是常客。这是一场想象中的相遇：角落里一位戴圆眼镜、叼着烟斗的先生放下笔，请你坐下。他想知道，你觉得自己自由吗。任务：和他谈谈自由与选择。",
 steps:[
  {t:"listen",fr:"Asseyez-vous ! Dites-moi : vous êtes libre ?",q:"他问了你什么？",opts:["请坐！告诉我：您是自由的吗？","请坐！告诉我：您幸福吗？","请站起来！您是谁？"],
   note:"Asseyez-vous 是“请坐”，Dites-moi 是“告诉我”。libre 平时也有“有空”的意思，哲学家问的是“自由”。"},
  {t:"build",ctx:"回答他：是的，我认为我是自由的。",tokens:["Oui,","je","pense","que","je","suis","libre."],extra:["pas"],
   zh:"是的，我认为我是自由的。",note:"je pense que… 是“我认为……”，后面接一个完整的句子。表达自己的看法时最常用。"},
  {t:"fill",npc:["Alors, vous choisissez votre vie.","那么，您的人生是您自己选的。"],ctx:"你有点犹豫，说：这并不容易。",before:"Ce n'est ",after:" facile.",opts:["pas","rien","ne"],
   full:"Ce n'est pas facile.",zh:"这不容易。",note:"否定是 ne 和 pas 把动词夹在中间。est 以元音开头，所以 ne 缩成了 n'。"},
  {t:"listen",fr:"L'existence précède l'essence.",q:"这是萨特最有名的一句话，意思是？",opts:["存在先于本质","本质先于存在","存在就是痛苦"],
   note:"萨特的意思是：人没有预先定好的“本质”，是先活在世上，再用自己的选择把自己造出来。précéder 是“在……之前”。"},
  {t:"choose",ctx:"告别前，对他说：我选择我的人生。",opts:[["Je choisis ma vie.","我选择我的人生。"],["Je cherche ma vie.","我在找我的人生。"],["Je choisis un café.","我选一杯咖啡。"]],
   note:"choisir（选择）的变形：je choisis，vous choisissez。ma vie 是“我的人生”，vie 是阴性词，所以用 ma。"},
  {t:"avis",q:"Et vous ? 对你来说，自由是什么？",opts:[["La liberté, c'est choisir.","自由就是选择。","S"],["La liberté, c'est agir avec les autres.","自由就是和别人一起行动。","B"],["La liberté, c'est vivre maintenant.","自由就是活在当下。","C"]]}
 ],
 vocab:[["la liberté", "自由"], ["libre", "自由的"], ["l'existence", "存在（阴性）"], ["exister", "存在"], ["choisir", "选择"], ["je choisis", "我选择"], ["un choix", "一个选择"], ["la vie", "人生，生活"], ["le sens", "意义"], ["penser", "想，认为"], ["je pense que…", "我认为……"], ["ne… pas", "不"], ["facile", "容易的"], ["Asseyez-vous !", "请坐！"]],
 lesson:{title:"否定：ne… pas",text:["把一句话变成否定，用 ne 和 pas 把动词夹在中间：Je suis libre（我是自由的）变成 Je ne suis pas libre（我不自由）。", "动词以元音开头时，ne 缩成 n'，比如 Je n'ai pas le choix（我没有选择）。", "口语里法国人常把 ne 吞掉，只说 pas，但写的时候两个都要有。"],ex:[["Je suis libre.", "我是自由的。"], ["Je ne suis pas libre.", "我不自由。"], ["Je ne sais pas.", "我不知道。"], ["Je n'ai pas le choix.", "我没有选择。"], ["Ce n'est pas facile.", "这不容易。"]]},
 carnet:[["Je pense que je suis libre.","我认为我是自由的。"],["Ce n'est pas facile.","这不容易。"],["L'existence précède l'essence.","存在先于本质。（萨特）"],["Je choisis ma vie.","我选择我的人生。"]],
 gram:"否定用 ne… pas 夹住动词：Je ne suis pas libre。元音前 ne 缩成 n'。"}
,{plaque:"Rue Victor-Schœlcher",arr:"14e Arr.",place:"波伏瓦的书房",frPlace:"Chez Simone de Beauvoir",who:"Simone",voice:"f",
 scene:"波伏瓦从 1955 年起住在这条街上，窗外就是蒙帕纳斯公墓。又是一场想象中的拜访：书房里堆满了书和照片，一位裹着头巾的女士请你在沙发上坐下。她想知道，你想成为什么样的人。任务：和她谈谈“成为”。",
 steps:[
  {t:"listen",fr:"Entrez ! Vous voulez un café ?",q:"她说了什么？",opts:["请进！您想喝杯咖啡吗？","请进！您想看本书吗？","请回吧！我在写作。"],

  {t:"listen",fr:"On ne naît pas femme : on le devient.",q:"这是《第二性》里最有名的一句，意思是？",opts:["女人不是天生的，而是后天成为的","女人天生就是女人","人不是生来就自由的"],
   note:"波伏瓦的意思是：“女人”不是天生注定的样子，而是在社会里一步步被塑造、也自己去成为的。on 是“人”，le 代替前面的 femme。"},
  {t:"fill",npc:["Et vous, qu'est-ce que vous voulez devenir ?","那您呢，您想成为什么样的人？"],ctx:"回答：我想成为一个自由的人。",before:"Je ",after:" devenir libre.",opts:["veux","veut","voulez"],

  {t:"build",ctx:"接着说：人是和别人一起变得自由的。",tokens:["On","devient","libre","avec","les","autres."],extra:["deviens"],

  {t:"choose",ctx:"告别时，谢谢她的咖啡和这番话。",opts:[["Merci pour le café et pour vos mots.","谢谢您的咖啡和您的话。"],["Merci pour le livre.","谢谢您的书。"],["Je ne veux pas de café.","我不要咖啡。"]],

 lesson:{title:"on，以及 vouloir 加动词",text:["on 是法语里最常用的小词之一，可以指“人、人们”，口语里也指“我们”。它后面的动词永远用“他、她”的那个形式：on est，on a，on devient。", "说“想做某事”，用 vouloir 加动词原形：je veux écrire（我想写作）。变形：je veux，tu veux，il veut，vous voulez。", "上一站学的否定在这里也用得上：On ne naît pas…（人不是生来就……）。"],ex:[["On est libre.", "人是自由的。也可以是：我们是自由的。"], ["On devient soi-même.", "人成为自己。"], ["Je veux écrire.", "我想写作。"], ["Vous voulez un café ?", "您想喝杯咖啡吗？"], ["Je veux devenir libre.", "我想成为一个自由的人。"]]},
 carnet:[["On ne naît pas femme : on le devient.","女人不是天生的，而是后天成为的。（波伏瓦）"],["Je veux devenir libre.","我想成为一个自由的人。"],["On devient libre avec les autres.","人是和别人一起变得自由的。"],["Merci pour le café et pour vos mots.","谢谢您的咖啡和您的话。"]],
 gram:"on 后面的动词用“他、她”的形式：on devient。想做某事：je veux 加动词原形。"}
,{plaque:"Boulevard Edgar-Quinet",arr:"14e Arr.",place:"蒙帕纳斯公墓，遇见加缪",frPlace:"Le cimetière du Montparnasse",who:"Albert",voice:"m",
 scene:"萨特和波伏瓦合葬在这座公墓，墓石上总留着读者的地铁票和玫瑰。最后一场想象中的相遇：一位竖着风衣领子的先生站在墓前，他来看两位老朋友，虽然他们吵翻过。他说，世界是荒诞的，可这并不妨碍人幸福。任务：和他谈谈荒诞与幸福。",

 lesson:{title:"il faut，pourquoi 和 parce que",text:["il faut 是“必须、应该”，后面直接跟动词原形，而且永远是 il faut，不随人称变：Il faut vivre（得活下去）。", "问“为什么”用 pourquoi，回答“因为”用 parce que。后面的词以元音开头时，que 缩成 qu'，比如 parce qu'il fait beau。", "il y a 是“有”，后面跟什么都行：il y a le soleil（有太阳）。"],ex:[["Il faut vivre.", "得活下去。"], ["Il faut aimer.", "应该去爱。"], ["Pourquoi vivre ?", "为什么活着？"], ["Parce que le monde est beau.", "因为世界是美的。"], ["Il y a le soleil.", "有太阳。"], ["Il ne faut pas désespérer.", "不应该绝望。"]]},
 carnet:[["Le monde est absurde, mais il fait beau aujourd'hui.","世界是荒诞的，可是今天天气很好。"],["Alors, pourquoi vivre ?","那么，为什么活着？"],["Parce qu'il y a le soleil, la mer et les amis.","因为有太阳、大海和朋友。"],["Il faut imaginer Sisyphe heureux.","应当想象西西弗是幸福的。（加缪）"],["Malgré tout, j'aime la vie.","不管怎样，我爱生活。"]],
 gram:"il faut 加动词原形是“必须、应该”。pourquoi 问为什么，parce que 回答因为。"}

/* ---------- polaroids: one per stop, a caption to hear and a true story behind it; images are made by make_photos.py ---------- */
const PHOTO=[{"fr": "Un vieux livre au bord de la Seine.","zh": "塞纳河边的一本旧书。","story": "1857 年《恶之花》出版后，波德莱尔被告上法庭，书里六首诗被判禁止刊印，直到 1949 年才解禁。"},{"fr": "Un café crème, comme Sartre et Beauvoir.","zh": "一杯奶油咖啡，和萨特、波伏瓦一样。","story": "二战时的冬天家里没有暖气，萨特和波伏瓦常常一整天待在花神咖啡馆二楼写作，因为这里有炉子取暖。"},{"fr": "Paris derrière l'horloge.","zh": "大钟后面的巴黎。","story": "奥赛原本是为 1900 年世界博览会建的火车站，1986 年才改成博物馆。从五楼的大钟后面，能望见塞纳河对岸的蒙马特。"},{"fr": "Les arcades de la place des Vosges.","zh": "孚日广场的拱廊。","story": "雨果从 1832 年到 1848 年住在这里，后来成为《悲惨世界》的那部小说，就是在这里动笔的。"},{"fr": "Un tableau encore frais.","zh": "一幅颜料还没干的画。","story": "1907 年，年轻的毕加索在附近的“洗衣船”画室画出了《亚维农少女》，蒙马特从此成了现代艺术的摇篮。"},{"fr": "Une madeleine pour Proust.","zh": "给普鲁斯特的一块玛德莱娜。","story": "在《追忆似水年华》里，一块浸过椴花茶的玛德莱娜小蛋糕，让叙述者想起了整个童年。所以这张照片里，我们放了一块在他的墓前。"},{"fr": "Un petit bateau sur le bassin.","zh": "水池上的小帆船。","story": "卢森堡公园大水池上的木头小帆船，从 1920 年代起就租给孩子们，用一根竹竿推着在水上走，一直到今天。"},{"fr": "Un manteau qui a déjà vécu.","zh": "一件有故事的大衣。","story": "玛黑区的老房子在 1960 年代差点被拆光。1962 年，文化部长马尔罗推动了一部新法律，把整片老街区保护了下来。"},{"fr": "La liberté sur une table de café.","zh": "咖啡桌上的自由。","story": "圆顶咖啡馆 1927 年开张时，三十多根柱子都请蒙帕纳斯的画家来画。据说有人是拿画抵了酒钱。"},{"fr": "Le bureau de Simone.","zh": "西蒙娜的书桌。","story": "《第二性》1949 年出版，第一周就卖出两万多册，后来梵蒂冈把它列入了禁书目录。"},{"fr": "Des tickets de métro pour Sartre et Beauvoir.","zh": "给萨特和波伏瓦的地铁票。","story": "1980 年萨特出殡时，五万多人跟着灵车走过巴黎街头。六年后，波伏瓦葬在了他的身边。"},{"fr": "Atmosphère ! Atmosphère !","zh": "“气氛！气氛！”","story": "1938 年的电影《北方旅馆》里，女演员阿尔莱蒂在运河铁桥上喊出这句台词，成了法国电影最有名的台词之一。其实那座桥是在摄影棚里搭的。"},{"fr": "Un vieux vinyle de chanson française.","zh": "一张老香颂黑胶。","story": "1964 年，芭芭拉写了一首《哥廷根》，唱给德国的听众。二战结束不到二十年，这首歌成了德法和解的象征。"},{"fr": "Sous le lustre de l'Opéra.","zh": "歌剧院的大吊灯下。","story": "1896 年，歌剧院大吊灯的一块配重掉下来，砸死了一名观众。作家勒鲁后来把这件事写进了《歌剧魅影》。"},{"fr": "Un pique-nique du marché.","zh": "从市场带来的野餐。","story": "阿里格市场旁边的博沃市场建于 1779 年，是巴黎最古老的有顶市场之一。"},{"fr": "Un déjeuner au bistrot.","zh": "小酒馆里的一顿午饭。","story": "2010 年，“法国美食大餐”被联合国教科文组织列为人类非物质文化遗产。入选的不是哪一道菜，而是法国人坐下来、好好吃一顿饭的习惯。"}];

/* ---------- stories: one short text per stop, read aloud line by line, then a cloze; [word] marks a blank ---------- */
const STORIES=[{"title":"致一位过路的女子","who":"Charles Baudelaire","duo":"Avec Charles Baudelaire.","duoZh":"和波德莱尔在一起。","vocab":[["bruyant, bruyante","吵闹的"],["une voiture","车（这里指马车）"],["un cheval, des chevaux","马"],["un cri","叫喊"],["la foule","人群"],["voir passer","看见……走过"],["mince","纤细的"],["porter le deuil","服丧"],["l'élégance","优雅"],["se croiser","交会"],["un éclair","闪电"],["disparaître","消失"],["revoir","再见到"],["un inconnu, une inconnue","陌生人"],["sourire","微笑"],["s'en aller","走开"]],"gram":["ne… jamais","和学过的 ne… pas 是同一个结构，把 pas 换成 jamais，意思是“再也不、从不”：Il ne va jamais la revoir（他再也不会见到她），顺带复习了“马上要做的事”。"],"text":[["Paris, 1860. Sur le boulevard, la rue est très [bruyante] : des voitures, des chevaux, des cris.","1860 年的巴黎。大街上震耳欲聋：马车声、马蹄声、叫喊声。"],["Au milieu de la [foule], Baudelaire voit passer une femme.","在人群中，波德莱尔看见一个女人走过。"],["Elle est grande et mince. Elle est en [noir], elle porte le deuil.","她高挑而纤细，一身黑衣，正在服丧。"],["Elle marche [vite], avec élégance.","她走得很快，姿态优雅。"],["Leurs [yeux] se croisent une seconde.","他们的目光交会了一秒。"],["« Un [éclair]… puis la nuit ! »","“一道闪电……然后是黑夜！”"],["La femme disparaît dans la foule. Il ne connaît pas son [nom], elle ne sait pas où il va.","女人消失在人群里。他不知道她的名字，她也不知道他要去哪里。"],["Il ne va [jamais] la revoir. Alors il écrit un poème pour elle : « À une passante ».","他再也不会见到她。于是他为她写了一首诗：《致一位过路的女子》。"],["Aujourd'hui, sur un pont, une inconnue me [sourit], puis elle s'en va. Je pense à Baudelaire.","今天，在一座桥上，一个陌生人对我笑了一下，然后走远了。我想起了波德莱尔。"]]},{"title":"咖啡馆的服务生","who":"Jean-Paul Sartre et Simone de Beauvoir","duo":"Avec Sartre et Beauvoir.","duoZh":"和萨特、波伏瓦在一起。","vocab":[["le chauffage","暖气"],["un poêle","炉子"],["il fait froid, il fait chaud","天冷，天热"],["s'asseoir","坐下"],["le premier étage","二楼（法国的一楼在地面上一层）"],["un geste","动作"],["précis","精确的"],["jouer à","扮演"],["faire semblant de","假装"],["une chose","东西"],["condamné","被判定的"],["choisir","选择"],["toujours","总是"],["s'habiller en","穿着"],["une cave","地窖"],["se demander","心里想"],["un rôle","角色"],["une chercheuse","女学者"]],"gram":["带 se 的动词","ils s'assoient（他们坐下）、les jeunes s'habillent（年轻人穿）、je me demande（我心想）。se 跟着人变：je me、il se、ils se。"],"text":[["Paris, 1943. C'est la guerre, il fait [froid], et il n'y a pas de chauffage dans les appartements.","1943 年的巴黎。正在打仗，天气很冷，家里都没有暖气。"],["Alors, chaque matin, Sartre et Beauvoir viennent au Café de Flore : ici, il y a un poêle, et il fait [chaud].","于是每天早上，萨特和波伏瓦都来花神咖啡馆：这里有一只炉子，很暖和。"],["Ils s'assoient au premier étage et ils [écrivent] toute la journée.","他们坐在二楼，写上一整天。"],["Sartre regarde le garçon de café. Ses gestes sont trop rapides, trop précis : il [joue] au garçon de café.","萨特看着咖啡馆的服务生。他的动作太快、太标准了：他在“扮演”一个服务生。"],["Pour Sartre, cet homme fait semblant d'être une [chose]. Mais un homme n'est pas une chose : il est [libre].","在萨特看来，这个人假装自己是一件东西。可是人不是东西：人是自由的。"],["« L'homme est condamné à être libre. » Il doit [choisir], toujours.","“人注定是自由的。”人必须选择，永远如此。"],["Après la guerre, tout le monde veut voir les « existentialistes ». Les jeunes s'habillent en [noir] et dansent dans les caves de Saint-Germain.","战争结束后，人人都想见一见“存在主义者”。年轻人穿一身黑，在圣日耳曼的地下酒窖里跳舞。"],["Aujourd'hui, au Flore, le garçon m'apporte un café crème. Il joue son rôle, et moi aussi.","今天，在花神，服务生给我端来一杯奶油咖啡。他在扮演他的角色，我也一样。"],["Je suis une étudiante, une fille, une chercheuse, une femme… J'ai beaucoup de [rôles].","我是学生，是女儿，是学者，是一个女人……我有很多角色。"],["Mais je sais que je joue, et je choisis mes rôles. Alors je veux vivre, et bien jouer ma vie.","可是我知道自己在扮演，而且这些角色是我自己选的。所以我要好好活着，把我的人生演好。"]]},{"title":"在火车站里画火车的人","who":"Claude Monet","duo":"Avec Claude Monet.","duoZh":"和莫奈在一起。","vocab":[["un peintre","画家"],["une exposition","展览"],["un port","港口"],["la brume","薄雾"],["le soleil levant","初升的太阳"],["un critique","评论家"],["se moquer de","嘲笑"],["la lumière","光"],["moderne","现代的"],["la fumée","烟，蒸汽"],["une gare","火车站"],["le chef de gare","站长"],["arrêter","停下"],["devenu, devenue","变成了"],["une horloge","钟"],["changer","改变"],["croire","相信"],["rendre","使变得"],["riche","丰富的"],["le bon chemin","正确的路"]],"gram":["讲故事的时间词","en 1874（在 1874 年）、un jour（有一天）、plus de cent ans plus tard（一百多年后）、aujourd'hui（今天）。法语讲历史常用现在时，靠这些词告诉读者时间。"],"text":[["En 1874, un groupe de jeunes [peintres] organise une exposition à Paris.","1874 年，一群年轻画家在巴黎办了一场展览。"],["Claude Monet montre un petit tableau : un port, le matin, un [soleil] orange dans la brume.","克洛德·莫奈展出了一幅小画：清晨的港口，雾里一轮橙色的太阳。"],["Le titre ? Impression, soleil levant. Un critique se [moque] d'eux et les appelle « les impressionnistes ».","画名叫《印象·日出》。一位评论家嘲笑他们，管他们叫“印象派”。"],["Mais Monet continue. Il aime la [lumière] qui change et la vie moderne.","可是莫奈没有停下。他喜欢变幻的光线，也喜欢现代的生活。"],["Il peint les [trains] et la fumée de la gare Saint-Lazare.","他画圣拉扎尔火车站的火车和蒸汽。"],["Un jour, il demande au chef de gare d'arrêter les trains et de faire beaucoup de [fumée]. Et le chef de gare dit oui !","据说有一天，他请站长把火车停下来，再多冒点蒸汽。站长居然答应了！"],["Plus de cent ans plus tard, ses tableaux arrivent… dans une [gare] : la gare d'Orsay, devenue un musée en 1986.","一百多年后，他的画来到了……一座火车站：奥赛火车站，1986 年变成了博物馆。"],["Aujourd'hui, derrière la grande horloge, je regarde la lumière sur la Seine. Elle [change] à chaque minute, comme dans un tableau de Monet.","今天，在大钟后面，我看着塞纳河上的光。它每一分钟都在变，就像莫奈的画。"],["Je comprends la leçon de Monet : si tu crois que ce que tu fais rend le monde plus [riche], tu es sur le bon chemin.","我明白了莫奈教给我的东西：只要你相信你所做的事会让世界变得更丰富，你就走在正确的路上。"]]},{"title":"雨果与一块面包","who":"Victor Hugo","duo":"Avec Victor Hugo.","duoZh":"和雨果在一起。","vocab":[["un soldat","士兵"],["arrêter","逮捕"],["pâle","苍白的"],["maigre","瘦的"],["voler","偷"],["un pain","一个面包"],["une voiture","马车"],["riche","有钱的"],["rentrer","回家"],["oublier","忘记"],["un roman","长篇小说"],["les pauvres","穷人"],["la prison","监狱"],["un éditeur","出版商"],["répondre","回答"],["un succès","成功"]],"gram":["ne… rien","和学过的 ne… pas、ne… jamais 同一个结构，意思是“什么也不”：Elle ne dit rien（她什么也不说）。"],"text":[["Hiver 1846. Victor Hugo marche dans une rue de Paris. Il fait très [froid].","1846 年冬天。维克多·雨果走在巴黎的一条街上。天气非常冷。"],["Devant lui, deux soldats arrêtent un homme pâle et maigre. Qu'est-ce qu'il a fait ? Il a [volé] un pain.","在他面前，两个士兵抓住了一个脸色苍白、骨瘦如柴的男人。他做了什么？他偷了一个面包。"],["À côté, dans une belle voiture, une femme [riche] regarde la scène. Elle ne dit rien.","旁边，一辆漂亮的马车里，一位有钱的女人看着这一幕。她什么也没说。"],["Hugo rentre chez lui, place des Vosges. Il ne peut pas [oublier] cet homme.","雨果回到孚日广场的家。他忘不了那个男人。"],["Il commence un grand roman sur les [pauvres] : Les Misérables.","他开始写一部关于穷人的长篇小说：《悲惨世界》。"],["Dans son livre, Jean Valjean passe dix-neuf ans en [prison] pour un pain.","在他的书里，冉·阿让为了一个面包坐了十九年牢。"],["Le roman sort en 1862. Hugo, loin de Paris, envoie un message à son éditeur : « ? ». L'éditeur répond : « ! ». Le livre est un grand [succès].","小说在 1862 年出版。据说远离巴黎的雨果给出版商发了一封信，只写了一个“？”。出版商回信：“！”。这本书大获成功。"],["Aujourd'hui, sous les arcades, je pense à cet homme et à son [pain].","今天，在拱廊下，我想起那个男人和他的面包。"]]},{"title":"洗衣船里的穷画家","who":"Pablo Picasso","duo":"Avec Pablo Picasso.","duoZh":"和毕加索在一起。","vocab":[["espagnol","西班牙的"],["habiter","住"],["en bois","木头做的"],["un robinet","水龙头"],["seul","唯一的"],["pauvre","穷的"],["triste","忧伤的"],["un cabaret","歌舞小酒馆"],["payer","付钱"],["un repas","一顿饭"],["le patron","老板"],["tomber amoureux","坠入爱河"],["un visage","脸"],["un masque","面具"],["choqué","震惊的"],["l'amour","爱情"],["la joie","愉悦"],["la douleur","伤痛"],["l'inspiration","灵感"],["complet, complète","完整的"]],"gram":["颜色和形容词的复数","名词是复数，形容词也加 s：des tableaux bleus（蓝色的画），des couleurs roses（粉色的颜色），ses amis sont choqués（他的朋友们很震惊）。"],"text":[["En 1904, un jeune [peintre] espagnol arrive à Montmartre. Il s'appelle Pablo Picasso. Il a vingt-deux ans.","1904 年，一个年轻的西班牙画家来到蒙马特。他叫巴勃罗·毕加索，二十二岁。"],["Il habite au Bateau-Lavoir, une vieille maison en [bois]. L'hiver, il fait très froid ; l'été, il fait très chaud. Il y a un seul robinet d'eau pour tout le monde.","他住在“洗衣船”，一栋老旧的木头房子。冬天冷得要命，夏天热得要命。整栋楼只有一个水龙头。"],["Picasso est [pauvre]. Ses tableaux sont tristes et [bleus].","毕加索很穷。他的画又忧伤又蓝。"],["Au cabaret du Lapin Agile, il ne peut pas [payer] son repas. Alors il donne un tableau au patron.","在狡兔酒馆，他付不起饭钱，就送了老板一幅画。"],["Puis il tombe amoureux, et ses couleurs deviennent [roses].","后来他恋爱了，他画里的颜色变成了粉红色。"],["En 1907, il peint un très grand tableau : cinq femmes avec des visages comme des [masques].","1907 年，他画了一幅巨大的画：五个女人，脸像面具一样。"],["Ses amis sont [choqués]. Mais ce tableau change l'art moderne : c'est le début du cubisme.","他的朋友们都惊呆了。可是这幅画改变了现代艺术：立体主义从这里开始。"],["Aujourd'hui, place du Tertre, je regarde les peintres et je pense à Picasso.","今天，在小丘广场，我看着画家们，想起了毕加索。"],["L'amour apporte la joie et la [douleur]. Il réveille l'inspiration, et il nous rend plus complets.","恋爱带给人愉悦，也带来伤痛。它唤醒灵感，让我们成为更完整的人。"]]},{"title":"普鲁斯特的玛德莱娜","who":"Marcel Proust","duo":"Avec Marcel Proust.","duoZh":"和普鲁斯特在一起。","vocab":[["tremper","浸"],["une madeleine","玛德莱娜蛋糕"],["une tasse de thé","一杯茶"],["goûter","尝"],["soudain","突然"],["l'enfance","童年"],["revenir","回来"],["un gâteau","蛋糕"],["le passé","过去"],["malade","生病的"],["l'asthme","哮喘"],["avoir peur de","害怕"],["le bruit","噪音"],["couvert de","覆盖着"],["le liège","软木"],["un souvenir","回忆"],["attaché à","绑在，系在"],["un goût","味道"],["une maison de plain-pied","平房"],["un chien","狗"]],"gram":["用 avoir 表达的感觉","中文说“我冷”“我怕”，法语说“我有冷”“我有怕”：avoir froid（冷）、avoir faim（饿）、avoir peur（害怕）、avoir de l'asthme（有哮喘）。"],"text":[["Dans le roman de Marcel Proust, un homme trempe une petite [madeleine] dans une tasse de thé.","在马塞尔·普鲁斯特的小说里，一个男人把一块小小的玛德莱娜蛋糕浸到一杯茶里。"],["Il goûte… et soudain, toute son [enfance] revient : la maison, le jardin, sa tante, le village.","他尝了一口……突然，整个童年都回来了：那座房子、那个花园、他的姨妈、那个村庄。"],["Un petit [gâteau] peut réveiller tout un passé.","一块小蛋糕，就能唤醒整个过去。"],["Proust est [malade]. Il a de l'asthme, et il a peur du bruit.","普鲁斯特身体不好。他有哮喘，而且害怕噪音。"],["Dans sa chambre, les murs sont couverts de liège. Il écrit la [nuit], dans son lit.","他卧室的墙上都包着软木。他在夜里写作，躺在床上写。"],["Pendant plus de dix ans, il écrit un [roman] immense : À la recherche du temps perdu.","十几年间，他写了一部巨大的小说：《追忆似水年华》。"],["Au printemps 1922, il dit à sa gouvernante : « J'ai écrit le mot fin. » Quelques mois plus tard, il meurt.","1922 年春天，他对女管家说：“我写下了‘完’字。”几个月后，他去世了。"],["Aujourd'hui, devant sa tombe, je mange une madeleine.","今天，在他的墓前，我吃了一块玛德莱娜。"],["Les souvenirs sont comme de la [fumée], mais ils restent attachés à des goûts.","记忆像烟雾一样，却总是和某些味道绑在一起。"],["Ce petit gâteau me ramène dans la maison de plain-pied de mon enfance.","这块小蛋糕把我带回了童年住过的平房。"],["Je revois mes [parents], jeunes, et mon petit chien qui court toujours autour de moi.","我又看见了年轻时的父母，还有那只总在我身边跑来跑去的小狗。"]]},{"title":"饿着肚子逛公园","who":"Ernest Hemingway","duo":"Avec Ernest Hemingway.","duoZh":"和海明威在一起。","vocab":[["un Américain","美国人"],["un écrivain","作家"],["l'argent","钱"],["avoir faim","饿"],["passer devant","从……前面经过"],["une boulangerie","面包店"],["sentir","闻，散发气味"],["la nourriture","食物"],["le ventre vide","空着肚子"],["mieux","更好"],["un crayon","铅笔"],["un carnet","笔记本"],["célèbre","有名的"],["recevoir","获得"],["une fête","节日，盛宴"],["le bonheur","幸福"]],"gram":["否定句里的 de","肯定说 il a de l'argent（他有钱），否定就变成 il n'a pas d'argent（他没有钱）。"],"text":[["Dans les années 1920, un jeune Américain vit à Paris avec sa femme et leur bébé. Il s'appelle Ernest Hemingway.","1920 年代，一个年轻的美国人和妻子、孩子住在巴黎。他叫欧内斯特·海明威。"],["Il veut devenir [écrivain], mais il n'a pas d'[argent].","他想当作家，可是他没有钱。"],["Quand il a [faim], il ne passe pas devant les boulangeries : ça sent trop bon !","饿的时候，他不从面包店门口走：太香了！"],["Il marche dans le jardin du Luxembourg : ici, on ne voit pas et on ne [sent] pas la nourriture.","他到卢森堡公园里散步：在这里，看不见也闻不到吃的。"],["Il va au musée du Luxembourg regarder les [tableaux] de Cézanne. Le ventre vide, dit-il, il les comprend mieux.","他去卢森堡博物馆看塞尚的画。他说，空着肚子，反而看得更懂。"],["Il écrit dans les cafés, avec un crayon et un [carnet].","他在咖啡馆里写作，用一支铅笔和一个笔记本。"],["Plus tard, il devient très [célèbre] et il reçoit le prix Nobel.","后来，他成了大名人，还得了诺贝尔奖。"],["Mais il appelle ces années à Paris « une fête » : il était pauvre, mais très [heureux].","可他把在巴黎的那些年叫作“一场流动的盛宴”：那时他很穷，但非常幸福。"],["Aujourd'hui, assise sur une chaise verte, je pense : le bonheur n'a pas besoin de beaucoup d'argent.","今天，我坐在一把绿色的椅子上，心想：幸福不需要很多钱。"]]},{"title":"墨绿色的大衣","who":"le vieux monsieur de la friperie","duo":"Avec le vieux monsieur de la friperie.","duoZh":"和中古店的老先生在一起。","vocab":[["un manteau","大衣"],["vert foncé","墨绿色"],["doux","柔软的"],["usé","旧了的"],["le comptoir","柜台"],["préféré","最喜欢的"],["mort, morte","去世了的"],["l'année dernière","去年"],["faire le tour du monde","周游世界"],["à deux","两个人一起"],["ranger","整理"],["un voyageur","旅人"],["raconter","讲述"],["les cheveux","头发"],["le rire","笑声"],["porter","穿着，带着"]],"gram":["son、sa、ses","意思是“他的、她的”。和 mon、ma、mes 一样，看的是后面东西的性别，不看主人是男是女：son rire（她的笑声），sa femme（他的妻子），ses tasses（她的杯子）。"],"text":[["Dans une petite friperie du Marais, je prends un [manteau] vert foncé. Il est doux, un peu usé.","在玛黑区一家小小的中古店里，我拿起一件墨绿色的大衣。它很柔软，有一点旧了。"],["Le vieux monsieur derrière le comptoir sourit : « C'était le manteau préféré de ma [femme]. »","柜台后面的老先生笑了笑：“这是我妻子最喜欢的大衣。”"],["Elle s'appelait Hélène. Elle est morte l'année dernière.","她叫埃莱娜。去年去世了。"],["Jeunes, ils ont fait le tour du [monde] ensemble, et ils ont [écrit] des livres à deux.","年轻的时候，他们一起周游世界，两个人一起写书。"],["Dans la boutique, il vend aussi ses stylos, ses carnets et ses [tasses] préférées.","店里还卖着她生前最喜欢的钢笔、笔记本和杯子。"],["« Je range nos [souvenirs], dit-il. Un par un. »","“我在整理我们的回忆，”他说，“一件一件地。”"],["À chaque voyageur qui passe, il raconte Hélène à vingt ans : ses cheveux dans le vent, son [rire], ses grandes idées.","每有一个旅人经过，他就讲起二十岁的埃莱娜：风里的头发，她的笑声，她那些远大的想法。"],["Il veut une seule chose : le monde ne doit pas l'oublier.","他只有一个心愿：这个世界不要忘记她。"],["J'achète le manteau. Maintenant, je porte un peu de son [histoire] avec moi.","我买下了这件大衣。从此，我身上也带着她的一点故事。"]]},{"title":"萨特说“不”","who":"Jean-Paul Sartre","duo":"Avec Jean-Paul Sartre.","duoZh":"和萨特在一起。","vocab":[["le journal","报纸"],["le prix Nobel","诺贝尔奖"],["la littérature","文学"],["important","重要的"],["refuser","拒绝"],["rester","保持"],["une statue","雕像"],["un journaliste","记者"],["attendre","等"],["la porte","门"],["continuer","继续"],["déjeuner","吃午饭"],["un choix","选择"],["difficile","难的"],["parfois","有时"],["soi-même","自己"]],"gram":["最高级 le plus","比较是 plus… que（比……更），前面加上 le 就是“最”：le prix le plus important（最重要的奖）。"],"text":[["Octobre 1964. À La Coupole, tout le monde lit le [journal] : Jean-Paul Sartre reçoit le prix Nobel de littérature !","1964 年 10 月。在圆顶咖啡馆，所有人都在看报纸：让-保罗·萨特获得了诺贝尔文学奖！"],["C'est le [prix] le plus important pour un écrivain, et il y a aussi beaucoup d'[argent].","这是一个作家能得到的最重要的奖，还有一大笔奖金。"],["Mais Sartre dit non. Il [refuse] le prix.","可是萨特说“不”。他拒绝了这个奖。"],["Pourquoi ? Pour lui, un écrivain doit rester [libre]. Il ne veut pas devenir une statue.","为什么？在他看来，作家必须保持自由。他不想变成一座雕像。"],["Les [journalistes] ne comprennent pas. Ils l'attendent devant sa porte.","记者们不明白。他们守在他家门口。"],["Sartre continue sa vie : il écrit, il marche dans Montparnasse, il [déjeune] à La Coupole avec Simone de Beauvoir.","萨特照常过日子：写作，在蒙帕纳斯散步，和西蒙娜·德·波伏瓦在圆顶咖啡馆吃午饭。"],["Refuser, c'est aussi un [choix]. Et choisir, pour Sartre, c'est être libre.","拒绝，也是一种选择。而对萨特来说，选择就是自由。"],["Aujourd'hui, à La Coupole, je pense : dire non, c'est difficile. Mais parfois, c'est dire oui à soi-même.","今天，在圆顶咖啡馆，我心想：说“不”很难。可有时候，说“不”就是对自己说“是”。"]]},{"title":"二十一岁的哲学家","who":"Simone de Beauvoir","duo":"Avec Simone de Beauvoir.","duoZh":"和波伏瓦在一起。","vocab":[["un examen","考试"],["la philosophie","哲学"],["réussir","通过，成功"],["à cette époque","那个年代"],["se marier","结婚"],["gagner sa vie","自己挣钱生活"],["rencontrer","遇见"],["s'aimer","相爱"],["un pacte","约定"],["tout se dire","什么都告诉对方"],["enseigner","教书"],["un scandale","轰动"],["d'abord","首先"],["étudier","研究"],["un désir","欲望"],["la tendresse","温情"],["partout","到处"],["l'air","空气"],["une épouse","妻子"],["le courage","勇气"],["à nouveau","重新"],["partager","分享"]],"gram":["表示“彼此”的 se","se 还可以表示“互相”：ils s'aiment（他们相爱），ils se marient（他们结婚），se dire（互相说）。"],"text":[["En 1929, une jeune femme de vingt et un ans passe un examen très difficile : l'agrégation de philosophie.","1929 年，一位二十一岁的年轻女子参加了一场非常难的考试：哲学教师资格会考。"],["Elle s'appelle Simone de Beauvoir. Elle est la plus [jeune] de France à réussir cet examen.","她叫西蒙娜·德·波伏瓦。她是全法国通过这场考试的人里年纪最小的。"],["À cette époque, on dit : « Une fille doit se marier et avoir des enfants. » Simone, elle, veut penser, [écrire] et gagner sa vie.","那个年代，人们说：“女孩就该结婚生孩子。”西蒙娜呢，她想思考、写作，自己挣钱养活自己。"],["Elle rencontre Sartre. Ils s'aiment, mais ils ne se [marient] pas, et ils n'habitent pas ensemble.","她遇见了萨特。他们相爱，但没有结婚，也不住在一起。"],["Ils font un pacte : rester [libres] et tout se dire.","他们立了一个约定：彼此自由，什么都告诉对方。"],["Elle enseigne, elle voyage, elle écrit. En 1949, son livre Le Deuxième Sexe fait scandale dans le monde entier.","她教书、旅行、写作。1949 年，她的书《第二性》在全世界引起轰动。"],["Pour elle, une femme libre, c'est d'abord une femme qui [travaille] et qui [choisit].","在她看来，一个自由的女人，首先是一个工作、能自己做选择的女人。"],["Aujourd'hui, dans son bureau plein de livres, Simone me demande : « Et vous, qu'est-ce que vous faites ? »","今天，在她堆满书的书房里，西蒙娜问我：“那您呢，您做什么？”"],["« J'étudie la finance. L'argent porte les désirs des gens, et aussi leur [tendresse]. Il est partout, comme l'air, mais peu de gens le voient vraiment. »","“我研究金融。钱承载着人的欲望，也承载着人的温情。它像空气一样无处不在，可是很少有人真正看见它。”"],["« Je suis chercheuse, fille, épouse, et peut-être un jour mère. Je n'ai plus peur de mes [rôles] : ils sont tous moi. »","“我是学者，是女儿，是妻子，也许有一天会成为母亲。我不再害怕我的角色：它们都是我。”"],["« Ma liberté, c'est le [courage] de choisir à nouveau, à tout moment. »","“我的自由，就是无论何时都有重新选择的勇气。”"],["Simone sourit : « Alors gardez votre travail, et ce courage. Et partagez-le avec les autres femmes. »","西蒙娜笑了：“那就守住你的工作，守住这份勇气。也把它分给别的女人。”"]]},{"title":"加缪口袋里的火车票","who":"Albert Camus","duo":"Avec Albert Camus.","duoZh":"和加缪在一起。","vocab":[["naître","出生"],["la guerre","战争"],["savoir lire","识字"],["un instituteur","小学老师"],["remarquer","注意到"],["aider","帮助"],["les études","学业"],["une lettre","信"],["remercier","感谢"],["un accident","事故"],["une poche","口袋"],["un billet de train","火车票"],["utiliser","用"],["un sac","包"],["fini","完成的"],["moi-même","我自己"],["trahir","背叛"]],"gram":["savoir 和 connaître","都是“知道”。connaître 用于认识人、知道作品；savoir 是“会做某事、知道某件事”：elle ne sait pas lire（她不识字）。"],"text":[["Albert Camus naît en Algérie, en 1913. Sa famille est très [pauvre].","阿尔贝·加缪 1913 年出生在阿尔及利亚。他家非常穷。"],["Son père meurt à la guerre quand Albert est bébé. Sa mère ne sait pas [lire].","他还是婴儿时，父亲就死在了战场上。他的母亲不识字。"],["À l'[école], un instituteur, Monsieur Germain, remarque ce petit garçon. Il l'[aide] à continuer ses études.","在学校里，一位名叫热尔曼的小学老师注意到了这个小男孩。他帮他继续读书。"],["Camus devient écrivain. En 1957, il reçoit le prix Nobel. Lui, il dit oui.","加缪成了作家。1957 年，他获得了诺贝尔奖。他接受了。"],["Quelques jours plus tard, il écrit une [lettre] à son vieil instituteur pour le remercier : sans lui, rien n'est possible.","几天后，他给当年的老师写了一封信，向他道谢：没有老师，这一切都不可能发生。"],["En 1960, Camus meurt dans un accident de voiture. Dans sa [poche], il y a un billet de train qu'il n'a pas utilisé.","1960 年，加缪死于一场车祸。他的口袋里，有一张没用上的火车票。"],["Dans son sac, il y a un roman pas [fini] : Le Premier Homme, l'histoire de son enfance.","他的包里，有一部没写完的小说：《第一个人》，写的是他的童年。"],["Aujourd'hui, devant la tombe couverte de tickets de métro, je pense au billet de train de Camus. Et moi, à qui est-ce que je veux dire merci ?","今天，在铺满地铁票的墓前，我想起了加缪那张火车票。那么我呢，我想对谁说一声谢谢？"],["À [moi-même]. Sur toute ma route, je ne me suis jamais trahie.","谢谢我自己。一路走来，我从未背叛过自己。"]]},{"title":"气氛！气氛！","who":"Arletty","duo":"Avec Arletty.","duoZh":"和阿尔莱蒂在一起。","vocab":[["un réalisateur","导演"],["tourner un film","拍电影"],["se passer","发生"],["au bord de","在……边上"],["un studio","摄影棚"],["même","甚至"],["une scène","一场戏"],["une actrice","女演员"],["se mettre en colère","发火"],["avoir besoin de","需要"],["crier","喊"],["une gueule","脸（俚语，有点粗）"],["une voix","嗓音"],["un accent","口音"],["sauver","拯救"],["rire","笑"]],"gram":["用 est-ce que 提问","在一句话前面加上 est-ce que，就变成疑问句：J'ai une gueule d'atmosphère. → Est-ce que j'ai une gueule d'atmosphère ?"],"text":[["En 1938, le réalisateur Marcel Carné tourne un [film] : Hôtel du Nord.","1938 年，导演马塞尔·卡尔内拍了一部电影：《北方旅馆》。"],["L'histoire se passe dans un petit [hôtel] au bord du canal Saint-Martin.","故事发生在圣马丁运河边的一家小旅馆里。"],["Mais on ne tourne pas au bord du canal : tout est construit en [studio], même le pont et l'eau !","可是电影并不是在运河边拍的：一切都是在摄影棚里搭出来的，连桥和水都是！"],["Dans une scène, sur le [pont], l'actrice Arletty se met en [colère]. Son ami dit qu'il a besoin de « changer d'atmosphère ».","有一场戏，在桥上，女演员阿尔莱蒂发火了。她的男友说他需要“换换气氛”。"],["Elle [crie] : « Atmosphère ! Atmosphère ! Est-ce que j'ai une gueule d'atmosphère ? »","她喊道：“气氛！气氛！我长得像‘气氛’吗？”"],["Avec sa [voix] et son accent de Paris, elle devient une star.","凭着她的嗓音和一口巴黎腔，她成了明星。"],["Cinquante ans plus tard, le vrai Hôtel du Nord doit être détruit. Les Parisiens protestent, et on le [sauve].","五十年后，真正的北方旅馆要被拆掉。巴黎人站出来抗议，旅馆被保了下来。"],["Ce soir, sur la passerelle, je crie tout bas : « Atmosphère ! » Et je ris.","今晚，在运河的铁桥上，我小声喊了一句：“气氛！”然后笑了起来。"]]},{"title":"一架被抬来的钢琴","who":"Barbara","duo":"Avec Barbara.","duoZh":"和芭芭拉在一起。","vocab":[["une chanteuse","女歌手"],["juif, juive","犹太的"],["se cacher","躲藏"],["inviter","邀请"],["hésiter","犹豫"],["faire peur","让人害怕"],["quand même","还是，仍然"],["un concert","演出"],["le bon","合适的那个"],["un étudiant","学生"],["porter","抬，搬"],["touché","感动的"],["le public","观众"],["les mêmes","一样的"],["un symbole","象征"],["l'amitié","友谊"]],"gram":["代词 y","已经说过的地方，第二次就用 y（那里）代替，放在动词前面：Elle va à Göttingen. → Elle y va.（她去那里。）"],"text":[["Barbara est une [chanteuse] française. Pendant la guerre, petite fille juive, elle doit se [cacher].","芭芭拉是一位法国女歌手。战争期间，还是犹太小女孩的她不得不躲藏起来。"],["En 1964, on l'invite à chanter en Allemagne, à Göttingen. Elle hésite : l'Allemagne lui fait encore [peur].","1964 年，有人邀请她去德国的哥廷根演唱。她犹豫了：德国仍然让她害怕。"],["Elle y va quand même. Mais le soir du concert, le [piano] n'est pas le bon. Barbara refuse de chanter.","她还是去了。可是演出那晚，钢琴不合适。芭芭拉拒绝上台。"],["Alors les étudiants cherchent un autre piano dans la ville, et ils le [portent] jusqu'à la salle.","于是学生们在城里找来另一架钢琴，一路抬到了演出厅。"],["Barbara est très [touchée]. Elle chante, et le public l'adore.","芭芭拉非常感动。她唱了，观众爱上了她。"],["Elle reste une semaine. Dans un jardin, elle écrit une nouvelle [chanson] : « Göttingen ».","她在那里待了一个星期。在一座花园里，她写了一首新歌：《哥廷根》。"],["Elle chante que les [enfants] sont les mêmes, à Paris ou à Göttingen. Cette chanson devient un symbole d'amitié entre la France et l'Allemagne.","她唱道：无论在巴黎还是在哥廷根，孩子们都是一样的。这首歌成了法德友谊的象征。"],["Aujourd'hui, chez le disquaire, j'écoute ce vieux vinyle. Une chanson peut faire ce que la politique ne peut pas : rapprocher les gens.","今天，在唱片店里，我听着这张老黑胶。一首歌能做到政治做不到的事：把人拉近。"]]},{"title":"歌剧院地下的湖","who":"le Fantôme de l'Opéra","duo":"Avec le Fantôme de l'Opéra.","duoZh":"和歌剧魅影在一起。","vocab":[["un lac","湖"],["un architecte","建筑师"],["un réservoir","水池"],["solide","稳固的"],["les pompiers","消防员"],["nager","游泳"],["le noir","黑暗"],["s'entraîner","训练"],["un contrepoids","配重"],["tomber","掉落"],["un fantôme","幽灵"],["caché","遮住的，藏起来的"],["une loge","包厢"],["personne ne…","没有人"],["l'ombre","阴影，暗处"],["montrer","露出，给人看"]],"gram":["faire 加动词原形","表示“让某事发生”：le Fantôme fait tomber le lustre（魅影让吊灯掉下来）。"],"text":[["Sous l'Opéra Garnier, il y a un vrai [lac]. Les architectes ont construit un grand réservoir d'eau pour que le bâtiment reste solide.","加尼叶歌剧院底下，真的有一个湖。建筑师们修了一个巨大的蓄水池，好让整座建筑稳稳当当。"],["Aujourd'hui encore, les pompiers viennent y [nager] dans le noir pour s'entraîner.","直到今天，消防员们还会来这里，在黑暗中游泳训练。"],["En 1896, pendant un spectacle, un contrepoids du grand [lustre] [tombe] sur le public. Une femme meurt.","1896 年，演出进行中，大吊灯的一块配重掉了下来，砸到观众席。一个女人死了。"],["Le journaliste Gaston Leroux n'oublie pas ces histoires. En 1910, il écrit un [roman].","记者加斯东·勒鲁一直记着这些故事。1910 年，他写了一部小说。"],["Un homme au visage caché vit sous l'Opéra, au bord du lac. Il aime une jeune [chanteuse], Christine. C'est le Fantôme de l'Opéra.","一个遮住脸的男人住在歌剧院底下的湖边。他爱上了年轻的女歌手克里斯汀。他就是“歌剧魅影”。"],["Dans le roman, le Fantôme fait tomber le lustre.","在小说里，魅影让大吊灯掉了下来。"],["Aujourd'hui, la [loge] numéro cinq est toujours la loge du Fantôme. Personne ne s'y assoit.","今天，五号包厢依然是魅影的包厢，据说没有人坐。"],["Ce soir, assise sous le lustre, je pense au Fantôme. Il aime dans l'[ombre], sans montrer son visage.","今晚，坐在大吊灯下，我想起了魅影。他在暗处爱着一个人，从不露出自己的脸。"],["Il y a des amours cachées, comme un lac sous un opéra : on ne les voit pas, mais elles portent tout.","有些爱是被藏起来的，就像歌剧院底下的湖：没有人看得见，却撑起了一切。"]]},{"title":"罗丝太太的水果摊","who":"Madame Rose","duo":"Avec Madame Rose.","duoZh":"和罗丝太太在一起。","vocab":[["un étal","摊位"],["au même endroit","在同一个地方"],["installer","摆放"],["une pêche","桃子"],["une montagne","山"],["connaître","认识"],["un fruit de plus","多一个水果"],["sans rien dire","什么也不说"],["un village","村子"],["couvert","有顶的"],["exister","存在"],["un roi","国王"],["une révolution","革命"],["un marchand","摊贩"],["goûter","尝"],["sucré","甜的"]],"gram":["depuis 加现在时","说“做某事已经多久了”用现在时：elle vend des fruits depuis cinquante ans（她卖水果已经五十年了，而且还在卖）。"],"text":[["Au marché d'Aligre, Madame Rose vend des [fruits] depuis cinquante ans.","在阿里格市场，罗丝太太卖水果已经卖了五十年。"],["Avant elle, il y avait sa mère, et avant sa mère, sa [grand-mère]. Le même étal, au même endroit.","在她之前是她母亲，再之前是她外婆。同一个摊位，同一个地方。"],["Chaque [matin], à six heures, elle installe les pommes, les fraises et les pêches en petites montagnes.","每天早上六点，她把苹果、草莓和桃子堆成一座座小山。"],["Elle [connaît] tout le monde : le vieux monsieur qui achète une seule pomme, l'étudiante qui n'a pas beaucoup d'argent.","她认识每一个人：只买一个苹果的老先生，手头不宽裕的女学生。"],["À l'étudiante, elle donne souvent un fruit de plus, sans rien dire.","她常常多塞给那个女学生一个水果，什么也不说。"],["« Un marché, ce n'est pas seulement des fruits, dit-elle. C'est un [village] au milieu de Paris. »","“市场可不只是卖水果，”她说，“它是巴黎中间的一个村子。”"],["Le marché couvert, à côté, existe depuis 1779. Les [rois] sont partis, les révolutions sont passées, mais les marchands sont toujours là.","旁边的室内市场从 1779 年就在了。国王们走了，革命也过去了，可是摊贩们一直都在。"],["Madame Rose me donne une [fraise] : « Goûtez ! » Elle est sucrée comme un souvenir d'été.","罗丝太太递给我一颗草莓：“尝尝！”它甜得像一段夏天的回忆。"]]},{"title":"一顿有历史的午饭","who":"Auguste Escoffier","duo":"Avec Auguste Escoffier.","duoZh":"和埃斯科菲耶在一起。","vocab":[["le mot","词"],["naître","诞生"],["un bouillon","浓汤"],["restaurer","恢复"],["les forces","体力"],["se réchauffer","取暖"],["selon la légende","据传说"],["une erreur","错误"],["le four","烤炉"],["à l'envers","倒过来"],["une armée","军队"],["un cuisinier","厨师"],["la maison","家"],["le dimanche","星期天"],["un poulet rôti","烤鸡"],["les pommes de terre","土豆"],["rester à table","坐在饭桌边"],["cuire","煮"],["tout doucement","慢慢地"],["mesurer","量"],["une recette","菜谱，方子"],["une bouchée","一口"]],"gram":["从前常常发生的事","讲过去反复发生的事，法语用另一种过去时：il y avait（那时有）、elle faisait（她那时常做）、la famille restait（一家人那时常常坐着）。词尾常见 -ait。"],"text":[["Monsieur Paul pose ma soupe sur la table : « Vous savez que le mot [restaurant] est né à Paris ? »","保罗先生把汤放在我桌上：“您知道‘餐馆’这个词是在巴黎诞生的吗？”"],["Vers 1765, un homme vend des bouillons qui « restaurent » les forces. Le restaurant est né.","大约 1765 年，有个人卖一种能“恢复”体力的浓汤。“餐馆”就这样诞生了。"],["Ma soupe à l'oignon a aussi une histoire : la [nuit], les ouvriers des Halles, le grand marché de Paris, la mangeaient pour se réchauffer.","我这碗洋葱汤也有来历：从前在巴黎的大市场“中央菜市场”，工人们夜里喝它来取暖。"],["Pour le dessert, une tarte Tatin. Selon la légende, vers 1880, les sœurs Tatin font une erreur : elles mettent la tarte au [four] à l'[envers]. Et c'est délicieux !","甜点是一块翻转苹果挞。传说大约在 1880 年，塔坦姐妹出了个错：她们把苹果挞倒着放进了烤炉。结果好吃极了！"],["Au début du XXe siècle, le grand chef Auguste Escoffier organise la cuisine comme une [armée] : chaque cuisinier a son poste.","二十世纪初，大厨奥古斯特·埃斯科菲耶把厨房组织得像一支军队：每个厨师各守一个位置。"],["« Mais la vraie cuisine française, dit Monsieur Paul, ce n'est pas au restaurant. C'est à la [maison]. »","“可是真正的法国菜，”保罗先生说，“不在餐馆里，在家里。”"],["« Le [dimanche], chez ma grand-mère, il y avait un poulet rôti, des pommes de terre, du fromage et une tarte. Toute la famille restait à table pendant trois heures. »","“每个星期天，在我外婆家，桌上有烤鸡、土豆、奶酪和一个苹果挞。一大家子人在桌边一坐就是三个钟头。”"],["« L'hiver, elle faisait un pot-au-feu : la viande et les légumes cuisent tout doucement, toute la matinée. »","“冬天，她做蔬菜炖牛肉：肉和菜用小火慢慢地煮，煮上一整个上午。”"],["« Et chez nous, les enfants apprennent à faire un [gâteau] au yaourt : on mesure tout avec le petit pot de yaourt ! »","“在我们这儿，孩子们学做的第一个蛋糕是酸奶蛋糕：所有东西都用那个小酸奶杯来量！”"],["« Ma blanquette, c'est la [recette] de ma grand-mère. Je ne l'ai jamais changée. »","“我店里的白汁炖小牛肉，用的就是我外婆的方子。我从来没改过。”"],["Je goûte ma tarte. Dans chaque bouchée, il y a deux cents ans d'histoire, et un peu de sa grand-mère. Santé, Paris !","我尝了一口苹果挞。每一口里，都有两百年的历史，还有一点点他外婆的味道。干杯，巴黎！"]]}];

const h=(t,a={},...c)=>{const e=document.createElement(t);
  for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  c.flat(Infinity).forEach(x=>{if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x))});return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ICON='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

/* ---------- speech: recorded audio first, the device's own voice as a fallback ---------- */
const akey=t=>{let x=2166136261;for(let i=0;i<t.length;i++){x^=t.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return ('0000000'+x.toString(16)).slice(-8)};
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[],voice=null,player=null,fellBack=false;
function fallbackUI(){
  $('#voicebox').hidden=!(fellBack&&voices.length>1);
  $('#warn').hidden=!(fellBack&&!voices.length);
}
function loadVoices(){
  if(!synth)return;
  voices=(synth.getVoices()||[]).filter(v=>/^fr/i.test(v.lang));
  const score=v=>(/fr[-_]FR/i.test(v.lang)?2:0)+(/google|am[ée]lie|thomas|audrey|premium|enhanced|natural/i.test(v.name)?1:0);
  voices.sort((a,b)=>score(b)-score(a));
  voice=voices.find(v=>v.name===st.voice)||voices[0]||null;
  $('#voice').replaceChildren(...voices.map(v=>h('option',{value:v.name,selected:v===voice},v.name+'（'+v.lang+'）')));
  fallbackUI();
}
function speakTTS(text,slow){
  if(!synth||!text)return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/—/g,'.'));
  u.lang='fr-FR';if(voice)u.voice=voice;u.rate=slow?0.6:0.92;
  synth.speak(u);
}
function speak(text,slow){
  if(!text)return;
  if(player){player.pause();player=null}
  if(synth)synth.cancel();
  const a=new Audio('audio/'+akey(text)+'.mp3');player=a;
  a.playbackRate=slow?0.7:1;
  a.addEventListener('error',()=>{if(player!==a)return;player=null;fellBack=true;fallbackUI();speakTTS(text,slow)});
  const p=a.play();if(p&&p.catch)p.catch(()=>{});
}
if(synth){loadVoices();synth.addEventListener&&synth.addEventListener('voiceschanged',loadVoices);}
$('#voice').addEventListener('change',e=>{st.voice=e.target.value;voice=voices.find(v=>v.name===st.voice)||voice;save();speakTTS('Bonjour, bienvenue à Paris !')});
$('#voicetest').addEventListener('click',()=>speakTTS('Bonjour, bienvenue à Paris !'));

function spk(text,big){
  const b=h('button',{class:'spk-b',type:'button','aria-label':'播放发音',onclick:e=>{e.stopPropagation();speak(text)}});
  b.innerHTML=ICON;if(big)b.append('听一听');
  const s=h('button',{class:'spk-s',type:'button','aria-label':'慢速播放',onclick:e=>{e.stopPropagation();speak(text,true)}},'慢速');
  return h('span',{class:'spk'+(big?' big':'')},b,s);
}
const frLine=(fr,zh)=>[h('div',{class:'line'},h('span',{class:'fr',lang:'fr'},fr),spk(fr)),zh&&h('p',{class:'zh'},zh)];
const bubble=(who,fr,zh)=>h('div',{class:'bubble'},h('span',{class:'who',lang:'fr'},who),frLine(fr,zh));

const objMarkup=o=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" aria-hidden="true"><rect class="qbg"/><g>'+o[4]+'</g></svg>';
function fitObj(svg,o){
  const crop=o[5];let b;
  try{b=crop?{x:crop[0],y:crop[1],width:crop[2],height:crop[3]}:svg.querySelector('g').getBBox()}catch(e){b={x:0,y:0,width:680,height:280}}
  if(!b.width||!b.height)b={x:0,y:0,width:680,height:280};
  let w=crop?b.width:b.width*1.3+16,hh=crop?b.height:b.height*1.3+16;
  if(w/hh<4/3)w=hh*4/3;else hh=w*3/4;
  const x=b.x+b.width/2-w/2,y=b.y+b.height/2-hh/2,bg=svg.querySelector('.qbg');
  svg.setAttribute('viewBox',[x,y,w,hh].join(' '));
  bg.setAttribute('x',x);bg.setAttribute('y',y);bg.setAttribute('width',w);bg.setAttribute('height',hh);
}

  $('#chapters').replaceChildren(...DATA.map((S,i)=>{const done=st.done.includes(i);
    return h('li',{},h('button',{type:'button',onclick:()=>enter(i)},

      done?starEl(st.res[i].stars):h('span',{class:'zh'},st.run&&st.run.i===i&&st.step>=0?'进行中':'未去过')))}));

function enter(i){
  const len=DATA[i].steps.length;
  if(!(st.run&&st.run.i===i&&st.cur===i&&st.step<=len)){
    st.cur=i;
    if(st.done.includes(i)){st.step=len+1;st.run=null;st.last=null}
    else{st.step=-1;newRun(i);st.combo=0}
  }
  save();setTab('jeu');window.scrollTo(0,0);
}

function renderStation(auto){
  const S=DATA[st.cur];
  if(st.step<=S.steps.length&&!(st.run&&st.run.i===st.cur)){newRun(st.cur);st.step=-1}
  $('#arr').textContent=S.arr;$('#plaque').textContent=S.plaque;

  $('#scene').textContent=S.scene;
  renderPic();
  if(st.step<0)renderLesson();else if(st.step>S.steps.length)renderReward(false);else if(st.step===S.steps.length)renderQuiz();else renderStep(auto);
}

  $('#pic').innerHTML='<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">'+sc.bg+sc.hots.map((o,k)=>
    '<g class="hot'+(found.includes(k)?' found':'')+'" data-k="'+k+'" tabindex="0" role="button" aria-label="'+o[0]+'">'+o[4]+
    '<circle class="mk" cx="'+o[2]+'" cy="'+o[3]+'" r="9"/><circle class="mkdot" cx="'+o[2]+'" cy="'+o[3]+'" r="3.5"/></g>'+(sc.mid&&sc.mid[k]||'')).join('')+'</svg>';
  const tally=()=>{$('#pichint').textContent='点图里带圆点的东西，听它的法语名字。已发现 '+found.length+' / '+sc.hots.length};
  const pick=g=>{const k=+g.dataset.k,o=sc.hots[k];
    if(!found.includes(k)){found.push(k);save()}
    $('#pic').querySelectorAll('.hot').forEach(x=>x.classList.remove('sel'));g.classList.add('found','sel');
    $('#word').replaceChildren(...frLine(o[0],o[1]));speak(o[0]);tally();};
  $('#pic').querySelectorAll('.hot').forEach(g=>{
    g.addEventListener('click',()=>pick(g));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g)}});});
  $('#word').replaceChildren();tally();
}

/* every stop opens with its word list and grammar; the same lesson can be reopened from any task */
const lessonBody=S=>h('div',{class:'lesson'},
  h('h2',{},'这一站要用到的词'),
  h('ul',{class:'entries vocab'},S.vocab.map(v=>h('li',{},frLine(v[0],v[1])))),

  S.lesson.text.map(x=>h('p',{class:'scene'},x)),
  h('ul',{class:'entries'},S.lesson.ex.map(v=>h('li',{},frLine(v[0],v[1])))));
function renderLesson(){
  picVis();
  const S=DATA[st.cur];
  $('#step').replaceChildren(h('p',{class:'count'},'先学一学'),
    h('p',{class:'scene'},'做任务之前，先把这一站要用的词和语法过一遍。每个词都点开听一听，跟着读；上面图里带圆点的东西也可以点。'),
    lessonBody(S),

const comboEl=()=>st.combo>=2&&h('span',{class:'combo'},' · 连对 ×'+st.combo);

function renderStep(auto){
  picVis();
  const S=DATA[st.cur],p=S.steps[st.step],box=$('#step'),run=st.run;
  const fb=h('div',{class:'fb','aria-live':'polite'});
  const kids=[h('p',{class:'count'},p.t==='avis'?'最后一问':'任务 '+(st.step+1)+' / '+S.steps.filter(x=>x.t!=='avis').length,comboEl())];
  if(p.npc)kids.push(bubble(S.who,p.npc[0],p.npc[1]));
  let missed=false,revealed=false;
  const lock=()=>box.querySelectorAll('.opt,.tile,.check').forEach(b=>b.disabled=true);
  const win=(fr,zh,say)=>{lock();
    run.n++;if(p.t==='listen')run.earN++;
    if(missed)st.combo=0;else{run.ft++;st.combo++;if(st.combo>st.best)st.best=st.combo;if(p.t==='listen'&&!revealed)run.ear++}
    save();
    fb.replaceChildren(h('p',{class:'ok',lang:'fr'},'Très bien !',!missed&&st.combo>=3&&h('span',{class:'combo',lang:'zh',style:'font:600 .9rem var(--f-ui)'},'　连对 ×'+st.combo)),
      ...(fr?frLine(fr,zh):[]),h('p',{class:'note'},p.note),
      h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:next},st.step+1<S.steps.length?'继续':'去做小测试')));
    if(say)speak(fr);fb.querySelector('.primary').focus({preventScroll:true});};
  const miss=msg=>{missed=true;run.miss++;st.combo=0;save();fb.replaceChildren(h('p',{class:'no'},msg))};

  if(p.t==='listen'){
    const txt=h('p',{class:'fr',lang:'fr',hidden:true},p.fr);
    kids.push(h('div',{class:'bubble'},h('span',{class:'who',lang:'fr'},S.who),h('div',{class:'line'},spk(p.fr,true)),txt,
      h('button',{class:'reveal',type:'button',onclick:e=>{revealed=true;txt.hidden=false;e.target.hidden=true}},'听不出来？显示文字')));
    kids.push(h('p',{class:'ctx'},p.q));
    const right=p.opts[0];
    kids.push(h('div',{class:'opts'},shuffle(p.opts).map(o=>h('button',{class:'opt',type:'button',onclick:e=>{
      if(o===right){e.target.classList.add('right');txt.hidden=false;win(null,null,false);fb.insertBefore(h('p',{class:'zh'},right),fb.children[1])}
      else{e.target.classList.add('wrong');e.target.disabled=true;miss('不是这个意思。再听一遍，可以点慢速。')}}},o))));
  }
  if(p.t==='choose'){
    kids.push(h('p',{class:'ctx'},p.ctx));
    const right=p.opts[0];
    kids.push(h('div',{class:'opts'},shuffle(p.opts).map(o=>h('div',{class:'optrow'},
      h('button',{class:'opt fr',lang:'fr',type:'button',onclick:e=>{
        if(o===right){e.target.classList.add('right');win(o[0],o[1],true)}
        else{e.target.classList.add('wrong');e.target.disabled=true;miss('这句的意思是：'+o[1])}}},o[0]),spk(o[0])))));
  }
  if(p.t==='fill'){
    kids.push(h('p',{class:'ctx'},p.ctx));
    const blank=h('span',{class:'blank'},'　');
    kids.push(h('p',{class:'fr',lang:'fr'},p.before,blank,p.after));
    const right=p.opts[0];
    kids.push(h('div',{class:'opts pills'},shuffle(p.opts).map(o=>h('button',{class:'opt fr',lang:'fr',type:'button',onclick:e=>{
      if(o===right){e.target.classList.add('right');blank.textContent=o;win(p.full,p.zh,true)}
      else{e.target.classList.add('wrong');e.target.disabled=true;miss('不是 '+o+'。再看看提示里这个词的阴阳性或人称。')}}},o))));
  }
  if(p.t==='avis'){   /* an opinion: every answer is accepted and remembered for the profile */
    kids.push(h('p',{class:'ctx'},p.q),h('p',{class:'zh'},'这一题没有对错，选最接近你想法的一句。每句都可以先点喇叭听一听。'));
    kids.push(h('div',{class:'opts'},shuffle(p.opts).map(o=>h('div',{class:'optrow'},
      h('button',{class:'opt fr',lang:'fr',type:'button',onclick:e=>{
        e.target.classList.add('right');lock();st.avis[st.cur]=o[2];save();
        fb.replaceChildren(...frLine(o[0],o[1]),h('p',{class:'note'},'记下了。这个想法和'+THINK[o[2]][1]+'比较接近：'+THINK[o[2]][2]),
          h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:next},'去做小测试')));
        speak(o[0]);fb.querySelector('.primary').focus({preventScroll:true});}},o[0]),spk(o[0])))));
  }
  if(p.t==='build'){
    kids.push(h('p',{class:'ctx'},p.ctx));
    const target=p.tokens.join(' ');
    const slot=h('div',{class:'slot fr',lang:'fr'}),pool=h('div',{class:'pool fr',lang:'fr'});
    const check=h('button',{class:'primary check',type:'button',disabled:true,onclick:()=>{
      const got=[...slot.children].map(x=>x.textContent).join(' ');
      if(got===target)win(target,p.zh,true);else miss('还不对。可以点“听答案”，照着听到的顺序排。')}},'检查');
    shuffle(p.tokens.concat(p.extra||[])).forEach(tok=>{
      const src=h('button',{class:'tile',type:'button'},tok);
      src.addEventListener('click',()=>{src.disabled=true;
        const put=h('button',{class:'tile',type:'button',onclick:()=>{put.remove();src.disabled=false;check.disabled=!slot.children.length}},tok);
        slot.append(put);check.disabled=false;});
      pool.append(src);});
    kids.push(slot,pool,h('div',{class:'row'},check,
      h('span',{class:'spk'},h('button',{type:'button',onclick:()=>speak(target)},'听答案'),h('button',{type:'button',onclick:()=>speak(target,true)},'慢速'))));
  }
  kids.push(fb,h('details',{class:'recall'},h('summary',{},'忘了？回看这一站的词和语法'),lessonBody(S)));
  box.replaceChildren(...kids);
  if(auto&&acted)speak(p.t==='listen'?p.fr:(p.npc?p.npc[0]:''));
}

const toStep=()=>$('#step').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
function next(){
  const S=DATA[st.cur];st.step++;save();
  if(st.step>=S.steps.length)renderQuiz();else renderStep(true);
  toStep();
}

function renderQuiz(){
  picVis();
  const S=DATA[st.cur],sc=SCENES[st.cur],box=$('#step'),n=sc.hots.length,run=st.run;
  const fb=h('div',{class:'fb','aria-live':'polite'});
  const cards=h('div',{class:'quiz'}),chips=h('div',{class:'row'});
  const cardEl={},chipEl={};let selW=null,selP=null,left=n;
  const finish=()=>{
    const i=st.cur,prev=st.res[i],stars=starsFor(run.miss);
    st.last={i:i,stars:stars,miss:run.miss};
    if(!prev||prev.old||stars>=prev.stars)st.res[i]={stars:stars,ft:run.ft,n:run.n,ear:run.ear,earN:run.earN,qm:run.qm};
    if(!st.done.includes(i))st.done.push(i);
    st.step=S.steps.length+1;st.run=null;save();renderReward(true);toStep();
  };
  const judge=()=>{
    if(selW==null||selP==null)return;
    const c=cardEl[selP],ch=chipEl[selW],o=sc.hots[selP];
    c.classList.remove('sel');ch.classList.remove('sel');
    if(selW===selP){
      c.classList.add('ok');c.disabled=true;c.querySelector('.qlab').textContent=o[0];ch.remove();left--;
      st.combo++;if(st.combo>st.best)st.best=st.combo;save();
      if(left)fb.replaceChildren(...frLine(o[0],o[1]));
      else{fb.replaceChildren(h('p',{class:'ok',lang:'fr'},'Très bien !'),h('p',{class:'zh'},n+' 个词全部配对成功。'),
        h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:finish},'完成这一站')));
        fb.querySelector('.primary').focus({preventScroll:true});}
    }else{
      run.qm++;run.miss++;st.combo=0;save();
      c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),700);
      fb.replaceChildren(h('p',{class:'no'},'不是这一张，再试试。'));
    }
    selW=selP=null;
  };
  shuffle(sc.hots.map((o,k)=>k)).forEach(k=>{
    const c=h('button',{class:'qcard',type:'button','aria-label':'图片',onclick:()=>{
      Object.values(cardEl).forEach(x=>x.classList.remove('sel'));selP=k;c.classList.add('sel');judge();}});
    c.innerHTML=objMarkup(sc.hots[k])+'<span class="qlab fr" lang="fr"></span>';
    cardEl[k]=c;cards.append(c);});
  shuffle(sc.hots.map((o,k)=>k)).forEach(k=>{
    const ch=h('button',{class:'tile fr',lang:'fr',type:'button',onclick:()=>{
      Object.values(chipEl).forEach(x=>x.classList.remove('sel'));selW=k;ch.classList.add('sel');speak(sc.hots[k][0]);judge();}},sc.hots[k][0]);
    chipEl[k]=ch;chips.append(ch);});
  box.replaceChildren(h('p',{class:'count'},'小测试',comboEl()),h('p',{class:'ctx'},'把词和图配成对：先点一个词，再点它对应的图。'),chips,cards,fb);
  Object.keys(cardEl).forEach(k=>fitObj(cardEl[k].querySelector('svg'),sc.hots[k]));
}

function entryList(S){return h('ul',{class:'entries'},S.carnet.map(c=>h('li',{},frLine(c[0],c[1]))))}

function pieceCard(i){
  const r=st.res[i],plus=r&&r.stars===3,o=[0,0,0,0,ROOM[i].svg+(plus?ROOM[i].up.svg:'')];
  const c=h('div',{class:'scard'+(plus?' gold':'')});c.innerHTML=objMarkup(o);
  return [c,o];
