/* a polaroid: the generated photo if it exists, otherwise the stop's own drawing */
const sceneMarkup=i=>{const sc=SCENES[i];return '<svg viewBox="170 0 340 280" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+sc.bg+sc.hots.map((o,k)=>o[4]+(sc.mid&&sc.mid[k]||'')).join('')+'</svg>'};
function polaroid(i,cls,duo){
  const P=PHOTO[i],S=STORIES[i],f=h('figure',{class:'polaroid'+(cls?' '+cls:''),style:'--r:'+((i*37+(duo?3:0))%7-3)+'deg'});
  const img=h('img',{src:'photos/'+(i+1)+(duo?'b':'')+'.jpg',alt:duo?S.duoZh:P.zh});
  img.addEventListener('error',()=>{const ph=h('div',{class:'ph',title:'照片还在冲洗，先看这一站的插图'});ph.innerHTML=sceneMarkup(i);img.replaceWith(ph)});
  f.append(img,h('figcaption',{lang:'fr'},duo?S.duo:P.fr));
  return f;
}
const photoBlock=(i,fresh)=>h('div',{class:'photo'},polaroid(i,fresh?'develop':''),
  h('div',{class:'story'},frLine(PHOTO[i].fr,PHOTO[i].zh),h('p',{},PHOTO[i].story)));
const duoBlock=(i,fresh)=>h('div',{class:'photo'},polaroid(i,fresh?'develop':'',true),
  h('div',{class:'story'},frLine(STORIES[i].duo,STORIES[i].duoZh),h('p',{},'读完《'+STORIES[i].title+'》并全部填对得到的合影。')));
const storyDone=i=>!!(st.story[i]&&st.story[i].perfect);

/* ---------- the story of a stop: words first, then read along, then fill the blanks ---------- */
const BLANK=/\[([^\]]+)\]/g;
const plainText=s=>s.replace(BLANK,'$1');
function renderStory(i,phase,k){
  document.querySelector('.picbox').hidden=true;
  const S=STORIES[i],box=$('#step');
  const head=[h('p',{class:'count'},'这一站的故事'),h('h2',{},S.title)];
  const backBtn=()=>h('button',{class:'tile',type:'button',onclick:()=>{renderReward(false);toStep()}},'回到这一站');
  if(phase==='learn'){
    box.replaceChildren(...head,
      h('p',{class:'scene'},'先认识这篇故事里的词和一个语法点，再一句一句跟读，最后做填空。全部填对，会得到一张你和故事里的人的合影。'),
      h('h3',{},'故事里的词'),h('ul',{class:'entries vocab'},S.vocab.map(v=>h('li',{},frLine(v[0],v[1])))),
      h('h3',{},'语法：'+S.gram[0]),h('p',{class:'note'},S.gram[1]),
      h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:()=>{renderStory(i,'read',0);toStep()}},'开始跟读'),backBtn()));
    return;
  }
  if(phase==='read'){
    const last=k===S.text.length-1;
    box.replaceChildren(...head,
      h('p',{class:'zh'},'跟读 '+(k+1)+' / '+S.text.length+'：先听一遍，再跟着大声读出来。读不顺就点“慢速”。'),
      h('ol',{class:'entries storylines'},S.text.slice(0,k+1).map((l,j)=>h('li',{class:j===k?'cur':''},frLine(plainText(l[0]),l[1])))),
      h('div',{class:'row'},
        h('button',{class:'primary',type:'button',onclick:()=>{if(last){renderStory(i,'cloze');toStep()}else renderStory(i,'read',k+1)}},last?'读完了，开始填空':'下一句'),
        k>0&&h('button',{class:'tile',type:'button',onclick:()=>renderStory(i,'read',k-1)},'上一句'),backBtn()));
    if(acted)speak(plainText(S.text[k][0]));
    const cur=box.querySelector('li.cur');if(cur)cur.scrollIntoView({block:'nearest'});
    return;
  }
  /* cloze */
  const slots=[];let sel=null;
  const fb=h('div',{class:'fb','aria-live':'polite'});
  const check=h('button',{class:'primary',type:'button',disabled:true},'检查');
  const ready=()=>{check.disabled=slots.some(s=>!s.dataset.v)};
  const unfill=s=>{if(s._chip)s._chip.hidden=false;s._chip=null;s.textContent='　';delete s.dataset.v;s.classList.remove('ok','bad');ready()};
  const lines=h('div',{class:'cloze'},S.text.map(l=>{
    const p=h('p',{class:'fr',lang:'fr'});let at=0;
    l[0].replace(BLANK,(m,w,off)=>{
      p.append(l[0].slice(at,off));
      const s=h('button',{class:'gap',type:'button','aria-label':'空格'},'　');s.dataset.ans=w;
      s.addEventListener('click',()=>{if(s.disabled)return;if(s.dataset.v)unfill(s);else{slots.forEach(x=>x.classList.remove('sel'));sel=s;s.classList.add('sel')}});
      slots.push(s);p.append(s);at=off+m.length;return m;});
    p.append(l[0].slice(at));return p;}));
  const bank=h('div',{class:'row bank'},shuffle(slots.map(s=>s.dataset.ans)).map(w=>{
    const c=h('button',{class:'tile fr',lang:'fr',type:'button'},w);
    c.addEventListener('click',()=>{
      const s=(sel&&!sel.dataset.v)?sel:slots.find(x=>!x.dataset.v);if(!s)return;
      s.textContent=w;s.dataset.v=w;s._chip=c;c.hidden=true;s.classList.remove('sel','ok','bad');sel=null;speak(w);ready();});
    return c;}));
  check.addEventListener('click',()=>{
    let n=0;slots.forEach(s=>{const ok=s.dataset.v===s.dataset.ans;s.classList.add(ok?'ok':'bad');if(ok)n++});
    const rec=st.story[i]||(st.story[i]={best:0,perfect:false});rec.best=Math.max(rec.best,n);
    if(n===slots.length){
      const first=!rec.perfect;rec.perfect=true;save();
      slots.forEach(s=>s.disabled=true);bank.hidden=true;check.hidden=true;
      fb.replaceChildren(h('p',{class:'ok',lang:'fr'},'Parfait !'),
        h('p',{},'全部填对。'+(first?'咔嚓！你得到了一张特别的拍立得，也放进了相册：':'这张合影已经在你的相册里：')),
        duoBlock(i,first),h('div',{class:'row'},backBtn()));
      fb.scrollIntoView({block:'start',behavior:'smooth'});
    }else{
      save();
      fb.replaceChildren(h('p',{class:'no'},'填对了 '+n+' / '+slots.length+' 个。标红的空不对，点它取下来，再换一个词。全部填对才有合影。'),
        h('div',{class:'row'},h('button',{class:'tile',type:'button',onclick:()=>{renderStory(i,'read',0);toStep()}},'回去再跟读一遍')));
    }
  });
  box.replaceChildren(...head,
    h('p',{class:'zh'},'点下面的词，它会填进第一个空格；想填哪个空，先点那个空格。点已经填好的空格可以把词取下来。'),
    lines,bank,h('div',{class:'row'},check,backBtn()),fb);
}

function renderReward(fresh){
  picVis();
  const i=st.cur,S=DATA[i],r=st.res[i],all=st.done.length===DATA.length,R=ROOM[i],plus=r.stars===3;
  const last=fresh&&st.last&&st.last.i===i?st.last:null,shown=last?last.stars:r.stars;
  const [card,o]=pieceCard(i);
  const verdict=last
    ?(last.miss===0?'一次都没错。':'这一轮错了 '+last.miss+' 次。')+(last.stars<3?'错 1 次以内是三颗星。':'')+(last.stars<r.stars?'你在这一站的最好成绩还是 '+r.stars+' 颗星。':'')
    :(r.old?'这一站是加入星星之前走完的，先记两颗星。再走一遍可以拿到真实成绩。':'这一站的最好成绩。');
  $('#step').replaceChildren(
    h('p',{class:'count'},'这一站完成'),
    h('div',{},starEl(shown,true)),
    h('p',{},shown===3&&last?h('span',{class:'fr',lang:'fr'},'Parfait ! '):null,verdict),
    h('div',{class:'keep'},card,h('div',{},h('p',{class:'zh'},'带回你的房间'),frLine(R.fr,R.zh),
      plus?[h('p',{class:'zh'},'三颗星，另外带回'),frLine(R.up.fr,R.up.zh)]:h('p',{class:'zh'},'拿到三颗星，还能带回：'+R.up.zh))),
    h('h2',{},'咔嚓！一张拍立得'),
    photoBlock(i,!!last),
    h('p',{class:'zh'},'照片已经放进房间的相册。'),
    h('h2',{},'这一站的故事：'+STORIES[i].title),
    h('p',{},storyDone(i)?'你已经读完并全部填对，得到了这张合影。想再读一遍也可以。':'跟读一篇法语小短文，再做填空。全部填对，会得到第二张拍立得：你和故事里的人的合影。'),
    storyDone(i)&&duoBlock(i,false),
    h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:()=>{renderStory(i,'learn');toStep()}},storyDone(i)?'再读一遍故事':'读这一站的故事')),
    h('h2',{},'这几句话收进了你的手帐'),
    entryList(S),
    h('p',{class:'note'},S.gram),
    h('div',{class:'row'},
      h('button',{class:'primary',type:'button',onclick:()=>{setTab('chambre');window.scrollTo(0,0)}},'回房间看看'),
      h('button',{class:'tile',type:'button',onclick:()=>setTab(all?'profil':'carte')},all?'看看我适合住在哪个街区':'回到地图，选下一站'),
      h('button',{class:'tile',type:'button',onclick:()=>{st.step=-1;newRun(i);st.combo=0;st.last=null;save();renderStation(true);toStep()}},r.stars<3?'再走一遍，争取三颗星':'再走一遍这一站'),
      ));
  fitObj(card.querySelector('svg'),o);
}

function renderCarnet(){
  const n=st.done.reduce((s,i)=>s+DATA[i].carnet.length,0);
  $('#carnet').replaceChildren(
    h('h2',{},'我的手帐 · Mon carnet'),
    h('p',{class:'zh'},n?'已收集 '+n+' 句。每句都可以点喇叭听，点“慢速”跟读。':'还没有句子。每走完一站，那一站的句子和语法会收到这里。'),
    ...DATA.map((S,i)=>h('section',{class:'stop'},h('h3',{lang:'fr'},(i+1)+' · '+S.frPlace),
      st.done.includes(i)?[entryList(S),h('p',{class:'note'},S.gram),h('p',{class:'zh'},'这一站的词'),
        h('ul',{class:'entries vocab'},S.vocab.map(v=>h('li',{},frLine(v[0],v[1])))),h('p',{class:'zh'},'图里的词'),
        h('ul',{class:'entries'},SCENES[i].hots.map(o=>h('li',{},frLine(o[0],o[1]))))]:h('p',{class:'locked'},S.place+'：走完这一站后解锁'))));
}

/* ---------- profile: four measured traits, a rank from stars, and the quartier whose stops went best ---------- */
const SKILL={
  precision:['准确','Précision','做任务时一次就答对的比例','Puriste','纯粹派','你几乎不出错。词序、阴阳性、冠词，都要弄对了才往下走，像一位字斟句酌的校对。'],
  oreille:['听力','Oreille','不看文字、一次听懂的比例','Mélomane','好耳朵','你靠耳朵学法语。不看文字就能听懂路人的话，街头的法语对你来说像一段旋律。'],
  memoire:['记词','Mémoire','小测试里图和词一次配对的比例','Encyclopédiste','百科全书派','见过的词你都记得住，图和词一配就准，像狄德罗编百科全书那样把巴黎一样一样收进脑子里。'],
  curiosite:['好奇','Curiosité','去过的地方里，图中点开过的东西的比例','Flâneur · Flâneuse','漫游者','你不急着赶路。每张图里的东西都要点一点、听一听，这正是波德莱尔笔下在巴黎街头闲逛的人。']};
/* each quartier: the stops inside it, the title it gives, and who it suits */
const QUART=[
  {fr:'Saint-Germain-des-Prés',zh:'圣日耳曼德佩',arr:'第 6 区',stops:[0,1,6],title:['Bibliophile','爱书人'],
   desc:'旧书摊、文学咖啡馆和卢森堡公园都在几步路之内，出版社和书店也最集中。这里适合手里总拿着一本书的人。'},
  {fr:'Le Marais',zh:'玛黑区',arr:'第 3、4 区',stops:[3,7],title:['Chineur · Chineuse','中古爱好者'],
   desc:'老宅子、孚日广场的拱廊，还有一条街接一条街的中古店。chiner 就是“淘旧货”，这里适合喜欢旧东西和它们背后故事的人。'},
  {fr:'Le quartier d\'Orsay',zh:'奥赛一带',arr:'第 7 区',stops:[2],title:['Esthète','爱美的人'],
   desc:'奥赛博物馆和罗丹美术馆都在这一带，街道安静、讲究。这里适合愿意在一幅画前站很久的人。'},
  {fr:'Montmartre',zh:'蒙马特',arr:'第 18 区',stops:[4],title:['Bohème','波西米亚艺术家'],
   desc:'山坡、台阶、画架和小酒馆。毕加索年轻时就住在这里，这里适合想自己动手画点什么的人。'},
  {fr:'Montparnasse',zh:'蒙帕纳斯',arr:'第 14 区',stops:[8,9,10],title:['Existentialiste','存在主义者'],
   desc:'大咖啡馆一家挨着一家，萨特和波伏瓦在这里写作、争论，最后也长眠在这里的公墓。这里适合爱追问“人为什么活着”的人。'},
  {fr:'Le canal Saint-Martin',zh:'圣马丁运河',arr:'第 10 区',stops:[11,12],title:['Cinéphile','影迷和乐迷'],
   desc:'运河、铁桥、小影院和唱片店。老电影在这里取过景，年轻人傍晚坐在河岸边聊天。这里适合离不开电影和音乐的人。'},
  {fr:"Le quartier de l'Opéra",zh:'歌剧院一带',arr:'第 9 区',stops:[13],title:['Noctambule','夜游人'],
   desc:'加尼叶歌剧院、大剧院和灯火通明的大道。这里的生活从傍晚才开始，适合爱看演出、不爱早睡的人。'},
  {fr:'Bastille et Aligre',zh:'巴士底与阿里格',arr:'第 11、12 区',stops:[14,15],title:['Gourmand · Gourmande','爱吃的人'],
   desc:'上午逛阿里格市场，中午在小酒馆吃一份套餐。这里适合把“吃什么”当成每天头等大事的人。'},
  {fr:'Ménilmontant',zh:'梅尼蒙当',arr:'第 20 区',stops:[5],title:['Rêveur · Rêveuse','沉思的漫步者'],
   desc:'巴黎东边的坡地，挨着拉雪兹神父公墓，安静，生活气息浓。这里适合喜欢一个人慢慢走、慢慢想的人。'}];
/* the three voices of the Montparnasse stops; the opinion questions are tallied against them */
const THINK={
  S:['Sartre','萨特','人先存在，再用自己的选择造出自己；自由很重，因为没有借口可找。'],
  B:['Beauvoir','波伏瓦','人是“成为”的，而且只有和别人一起、在行动里，自由才是真的。'],
  C:['Camus','加缪','世界没有现成的答案，但阳光、大海和朋友，已经足够让人对生活说“是”。']};
function thinker(){
  const c={S:0,B:0,C:0};let n=0;Object.keys(st.avis||{}).forEach(k=>{if(c[st.avis[k]]!=null){c[st.avis[k]]++;n++}});
  if(!n)return null;
  const m=Math.max(c.S,c.B,c.C);return {n:n,top:['S','B','C'].filter(k=>c[k]===m)};
}
const quartOf=i=>QUART.find(q=>q.stops.includes(i));
function traits(){
  let ft=0,n=0,ear=0,earN=0,q=0,qn=0,found=0,real=0;
  st.done.forEach(i=>{const r=st.res[i];found+=(st.found[i]||[]).length;
    if(r&&!r.old){real++;ft+=r.ft;n+=r.n;ear+=r.ear;earN+=r.earN;q+=5-Math.min(5,r.qm);qn+=5}});
  const pc=(a,b)=>b?Math.round(100*a/b):null;
  return {real:real,v:{precision:pc(ft,n),oreille:pc(ear,earN),memoire:pc(q,qn),curiosite:pc(found,st.done.length*5)}};
}
/* how well one stop went, 0 to 1: half from what was brought home (stars), the rest from accuracy and from looking around */
function stopScore(i){
  if(!st.done.includes(i))return 0;
  const r=st.res[i],acc=r.old||!r.n?0.67:r.ft/r.n;
  return 0.5*r.stars/3+0.3*acc+0.2*(st.found[i]||[]).length/5;
}
const quartScores=()=>QUART.map(q=>({q:q,v:Math.round(100*q.stops.reduce((s,i)=>s+stopScore(i),0)/q.stops.length)})).sort((a,b)=>b.v-a.v);
function topSkill(tr){
  const v=tr.v,keys=['curiosite','oreille','memoire','precision'];
  if(keys.every(k=>v[k]!=null&&v[k]>=95))return ['Virtuose','全能型','四项都在 95 分以上：耳朵、记性、准确和好奇心，你一样不缺。'];
  let top=null;keys.forEach(k=>{if(v[k]!=null&&(top==null||v[k]>v[top]))top=k});
  if(!top)return null;
  const s=SKILL[top];return [s[3],s[4],'你最强的一项是“'+s[0]+'”。'+s[5]];
}
function renderProfil(){
  const tr=traits(),N=DATA.length,stars=totalStars(),max=N*3,all=st.done.length===N;
  const rank=stars>=max?['Légende','传奇']:stars>=max*2/3?['Guide','向导']:stars>=max/3?['Pensionnaire','常住客']:['Touriste','游客'];
  const th=thinker(),qs=quartScores(),best=qs[0].q,ready=st.done.length>=3,sk=topSkill(tr);
  const foundAll=Object.keys(st.found).reduce((s,k)=>s+st.found[k].length,0);
  const items=q=>q.stops.filter(i=>st.done.includes(i)).flatMap(i=>[ROOM[i].fr].concat(st.res[i].stars===3?[ROOM[i].up.fr]:[]));
  $('#profil').replaceChildren(
    h('h2',{},'我的巴黎 · Mon Paris'),
    h('div',{class:'typecard'},
      h('p',{class:'count'},'等级：',h('span',{lang:'fr'},rank[0]),' '+rank[1]+' · 星星 '+stars+' / '+max),
      ready?[h('p',{class:'zh'},all?'你适合住在':'目前看，你适合住在（所有地方走完后定下来）'),
          h('p',{class:'tfr',lang:'fr'},best.fr),h('p',{class:'tzh'},best.zh+'（巴黎'+best.arr+'）'),
          h('p',{},'称号：',h('b',{lang:'fr'},best.title[0]),'　'+best.title[1]),
          h('p',{},best.desc),
          h('p',{class:'zh'},'依据：你从这个街区带回了 ',h('span',{lang:'fr'},items(best).join('、')),'；在这里拿的星、答对的比例和图里点开的东西，合起来比别的街区高。'),
          sk&&h('p',{},'你的学法：',h('b',{lang:'fr'},sk[0]),'　'+sk[1]+'。'+sk[2])]
        :h('p',{},'再走完 '+(3-st.done.length)+' 个地方，这里会根据你带回的东西，告诉你适合住在巴黎的哪个街区。'),
      th&&h('p',{},'谈到人生的意义（你回答了 '+th.n+' 个问题）：',th.top.length===1
        ?['你更接近 ',h('b',{lang:'fr'},THINK[th.top[0]][0]),' '+THINK[th.top[0]][1]+'。'+THINK[th.top[0]][2]]
        :'你在'+th.top.map(k=>THINK[k][1]).join('、')+'之间，没有只站在哪一边。'),
      h('p',{class:'zh'},'等级看星星：'+Math.ceil(max/3)+' 颗升“常住客”，'+Math.ceil(max*2/3)+' 颗升“向导”，'+max+' 颗满星是“传奇”。')),
    h('h3',{},'各街区和你的契合度'),
    h('div',{class:'attrs'},qs.map(x=>{const q=x.q,d=q.stops.filter(i=>st.done.includes(i)).length;
      return [h('div',{class:'an'},h('b',{},q.zh+' ',h('span',{lang:'fr',style:'font-size:.9rem'},q.title[0])),h('span',{},'去过 '+d+' / '+q.stops.length+' 个地方 · '+q.title[1])),
        h('div',{class:'bar',role:'img','aria-label':q.zh+' '+x.v+' 分'},h('i',{style:'width:'+x.v+'%'})),h('div',{class:'av'},String(x.v))]})),
    h('p',{class:'zh'},'每个街区的分数，一半看你在那里带回了多少东西（星星），其余看答对的比例和图里点开了多少东西；没去过的地方算零分。'),
    h('h3',{},'四项属性'),
    h('div',{class:'attrs'},Object.keys(SKILL).map(k=>{const s=SKILL[k],x=tr.v[k];
      return [h('div',{class:'an'},h('b',{},s[0]+' ',h('span',{lang:'fr',style:'font-size:.9rem'},s[1])),h('span',{},s[2])),
        h('div',{class:'bar',role:'img','aria-label':s[0]+(x==null?' 暂无':' '+x+' 分')},h('i',{style:'width:'+(x||0)+'%'})),h('div',{class:'av'},x==null?'—':String(x))]})),
    h('p',{class:'zh'},'最长连对 '+st.best+' 次 · 图里点开过的东西 '+foundAll+' / '+N*5+' · 房间里的东西 '+st.done.length+' / '+N+'。'),
    h('div',{class:'row'},h('button',{class:'tile',type:'button',onclick:()=>setTab('chambre')},'去看我的房间')));
}

/* ---------- room ---------- */
function renderRoom(){
  const have=i=>st.done.includes(i),plus=i=>have(i)&&st.res[i]&&st.res[i].stars===3;
  const n=st.done.length,u=DATA.filter((S,i)=>plus(i)).length,N=DATA.length;
  const hot=(o,svg)=>'<g class="hot ritem" tabindex="0" role="button" aria-label="'+o.fr+'" data-fr="'+o.fr+'" data-zh="'+o.zh+'">'+svg+'</g>';
  const room=h('div',{id:'room'}),word=h('div',{id:'roomword','aria-live':'polite'});
  const albumDetail=h('div',{'aria-live':'polite'});
  const album=h('div',{class:'album'},DATA.map((S,i)=>{
    if(!have(i))return h('figure',{class:'polaroid empty'},h('div',{class:'ph'},'?'),h('figcaption',{},S.place));
    const f=polaroid(i);f.tabIndex=0;f.setAttribute('role','button');f.setAttribute('aria-label',PHOTO[i].zh+'，看故事');
    const open=()=>{albumDetail.replaceChildren(photoBlock(i,false));speak(PHOTO[i].fr);albumDetail.scrollIntoView({block:'nearest',behavior:'smooth'})};
    f.addEventListener('click',open);f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    if(!storyDone(i))return f;
    const g=polaroid(i,'',true);g.tabIndex=0;g.setAttribute('role','button');g.setAttribute('aria-label',STORIES[i].duoZh+'，看看');
    const openB=()=>{albumDetail.replaceChildren(duoBlock(i,false));speak(STORIES[i].duo);albumDetail.scrollIntoView({block:'nearest',behavior:'smooth'})};
    g.addEventListener('click',openB);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openB()}});
    return [f,g];}));
  room.innerHTML='<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="你的房间">'+ROOM_BG+hot({fr:'la fenêtre',zh:'窗户'},ROOM_WIN)+
    [0,7,10,8,15,13,2,3,4,9,6,1,5,12,14,11].map(i=>have(i)?hot(ROOM[i],ROOM[i].svg)+(plus(i)?hot(ROOM[i].up,ROOM[i].up.svg):''):'').join('')+'</svg>';
  room.querySelectorAll('.ritem').forEach(g=>{
    const say=()=>{word.replaceChildren(...frLine(g.dataset.fr,g.dataset.zh));speak(g.dataset.fr)};
    g.addEventListener('click',say);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say()}});});
  const intro=n===0?'弗吉尼亚·伍尔夫在《一间自己的房间》里写道：一个女人要写作，得有钱，还得有一间属于自己的房间。这是你在巴黎屋顶下的房间，现在只有一扇窗和一盏灯。到街上去走走，每走完一个地方，就带一件东西回来。'
    :n<N?'你的房间里已经有 '+n+' 件带回来的东西。点一点它们，听听法语怎么说。还有 '+(N-n)+' 个地方没去。'
    :'房间布置好了。书架、书桌、画架和猫都在，这是一间属于你自己的房间。'+(u<N?'还有 '+(N-u)+' 件可以靠三颗星再添一样东西。':'每一件都是最好的样子。');
  $('#chambre').replaceChildren(
    h('div',{class:'line'},h('h2',{class:'fr',lang:'fr',style:'font-size:1.6rem;font-weight:500'},INTRO_FR),spk(INTRO_FR)),
    h('p',{class:'scene'},intro),
    room,word,
    h('p',{class:'zh'},'已带回 '+n+' / '+N+' 件 · 三颗星添的东西 '+u+' / '+N+'。点房间里的东西可以听它的法语名字。'),
    h('div',{class:'row'},h('button',{class:'primary',type:'button',onclick:()=>{setTab('carte');window.scrollTo(0,0)}},n?'去地图，再带一件回来':'去地图，出门走走')),
    h('h2',{},'L\'album · 相册'),
    h('p',{class:'zh'},n?'每走完一个地方，就多一张拍立得；读完那里的故事并全部填对，还会多一张合影。点一张照片，看它背后的故事。':'相册还是空的。走完第一个地方，就会有第一张拍立得。'),
    album,albumDetail,
    h('ol',{class:'chapters'},DATA.map((S,i)=>h('li',{},h('button',{type:'button',onclick:()=>enter(i)},
      h('span',{class:'cnum'+(have(i)?' done':'')},String(i+1)),
      h('span',{class:'cname'},have(i)?h('b',{lang:'fr'},ROOM[i].fr+'　',h('span',{lang:'zh'},ROOM[i].zh)):h('b',{},'？'),
        h('span',{},have(i)?(plus(i)?'来自'+S.place+'，三颗星还带回了 '+ROOM[i].up.fr+'（'+ROOM[i].up.zh+'）':'来自'+S.place+'。拿到三颗星，还能带回'+ROOM[i].up.zh):'走完“'+S.place+'”带回来')),
      have(i)?starEl(st.res[i].stars):h('span',{class:'zh'},'未去过'))))));
}

/* ---------- views ---------- */
function setTab(t){
  st.tab=t;save();
  ['chambre','carte','jeu','carnet','profil'].forEach(v=>{$('#'+v).hidden=v!==t});
  $('#tab-chambre').setAttribute('aria-selected',t==='chambre');
  $('#tab-carte').setAttribute('aria-selected',t==='carte'||t==='jeu');
  $('#tab-carnet').setAttribute('aria-selected',t==='carnet');
  $('#tab-profil').setAttribute('aria-selected',t==='profil');
  if(t==='chambre')renderRoom();else if(t==='carte')renderMap();else if(t==='jeu')renderStation(false);else if(t==='carnet')renderCarnet();else renderProfil();
}
$('#tab-chambre').addEventListener('click',()=>setTab('chambre'));
$('#tab-carte').addEventListener('click',()=>setTab('carte'));
$('#tab-carnet').addEventListener('click',()=>setTab('carnet'));
$('#tab-profil').addEventListener('click',()=>setTab('profil'));
$('#back').addEventListener('click',()=>setTab('carte'));
setTab(st.tab);
</script>
